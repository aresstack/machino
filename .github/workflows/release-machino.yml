name: release-machino
# Cuts a release from a tag: build, verify, publish the OpenIPC install bundle.
#
# The point of having this as its own workflow rather than a checkbox on the
# build is the RELEASE NOTES. Every release so far has had to state, by hand,
# which claims were verified on hardware and which were not -- and doing that
# by hand is exactly how a release ends up claiming more than was measured.
# Here the note is generated from facts the job can actually observe (the
# commit, the toolchain, the test counts, the SHA256SUMS) and everything else
# is carried in docs/pending-physical.md, which is attached verbatim.
#
# Nothing here runs a camera. A release is "this built and passed the host
# suite", never "this works on your camera".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true
  push:
    tags: [ 'v*' ]

permissions:
  contents: write        # needed to create the release
  actions: read          # gh run download holt die WLAN-Nutzlast (Treiber,
                         # Firmware, hostapd) aus ihren eigenen Workflows

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDK_VERSION: "1.3.1"
      SOC: "T40"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: "Install build dependencies"
        run: sudo apt-get update && sudo apt-get install -y build-essential wget curl git python3 xxd rsync bc cpio unzip file

      - name: "WiFi payload (driver, firmware, hostapd) -- required for a release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p wifi-payload
          for wf in build-aic8800-t40.yml build-hostapd-t40.yml; do
            id=$(gh run list --workflow "$wf" --status success --limit 1 --json databaseId -q ".[0].databaseId")
            [ -n "${id:-}" ] && [ "$id" != "null" ] ||
              { echo "::error::no successful run of $wf -- a release must ship the WiFi payload"; exit 1; }
            gh run download "$id" -D "wifi-payload/$wf" ||
              { echo "::error::artifact of $wf run $id is not downloadable (expired?); re-run that workflow"; exit 1; }
          done
          find wifi-payload -type f

      - name: "Fetch and build mbedTLS"
        run: sh machino/tools/fetch-mbedtls.sh "$PWD/3p" gcc ar

      - name: "Host suite (the gate)"
        run: |
          set -o pipefail
          make -C machino test MBEDTLS="$PWD/3p/mbedtls-3.6.7" 2>&1 | tee "$RUNNER_TEMP/tests.log"
          # The counts go into the release note, so they are extracted rather
          # than retyped. A release that claims a number nobody measured is
          # the specific failure this guards against.
          grep -E '^(machino unit tests|streamerctl tests|openipc install tests):' \
               "$RUNNER_TEMP/tests.log" > "$RUNNER_TEMP/counts.txt"
          cat "$RUNNER_TEMP/counts.txt"
          if grep -qE '[1-9][0-9]* failed' "$RUNNER_TEMP/counts.txt"; then
            echo "::error::the host suite reported failures; not releasing"
            exit 1
          fi

      - name: "Guards"
        run: |
          sh machino/tools/check-linux-only.sh
          sh machino/tools/check-netui.sh machino/src/app/http/netui.cpp
          # The make-free runner must not have rotted either: it is what a
          # contributor without make will use to check their work.
          rm -rf machino/build machino/tests/machino-tests
          sh machino/tools/host-test.sh "$PWD/3p/mbedtls-3.6.7" >/dev/null

      - name: "Cross-build and bundle"
        run: |
          set -eu
          chmod +x build.sh
          ./build.sh deps "$SOC" --libc-musl
          TC=$(ls -d toolchain/xburst2-musl/*/bin | head -1)
          sh machino/tools/fetch-mbedtls.sh "$PWD/3p" "$PWD/$TC/mipsel-linux-gcc" "$PWD/$TC/mipsel-linux-ar"
          make -C machino -j"$(nproc)" WERROR=1 \
            MBEDTLS="$PWD/3p/mbedtls-3.6.7" \
            CROSS_COMPILE="$PWD/$TC/mipsel-linux-" \
            PLATFORM="$SOC" \
            IMP_INC="$PWD/include/$SOC/$SDK_VERSION/en" \
            IMP_LIB="$PWD/3rdparty/install/lib" \
            IMPLIBS="-Wl,--start-group -l:libimp.a -l:libalog.a -l:libsysutils.a -Wl,--end-group -l:libmuslshim.a"
          make -C machino MBEDTLS="$PWD/3p/mbedtls-3.6.7" CROSS_COMPILE="$PWD/$TC/mipsel-linux-" strip

          O=bundle/machino-openipc-t40nn
          mkdir -p "$O/sbin" "$O/init"
          cp -f machino/machinod                       "$O/machino"
          cp -f machino/machino.conf.example           "$O/machino.conf"
          cp -f machino/openipc/install.sh             "$O/install.sh"
          cp -f machino/openipc/uninstall.sh           "$O/uninstall.sh"
          cp -f machino/openipc/sbin/streamerctl       "$O/sbin/streamerctl"
          cp -f machino/openipc/sbin/machino-manager   "$O/sbin/machino-manager"
          cp -f machino/openipc/init/S95streamer       "$O/init/S95streamer"
          cp -f machino/openipc/init/machino           "$O/init/machino"
          cp -f machino/openipc/init/S42usb            "$O/init/S42usb"
          cp -f machino/openipc/sbin/machino-usb-helper "$O/sbin/machino-usb-helper"
          cp -f machino/openipc/sbin/machino-wifi-role "$O/sbin/machino-wifi-role"
          cp -f machino/openipc/udhcpc-wlan.script     "$O/udhcpc-wlan.script"
          cp -f machino/openipc/README.md              "$O/README.md"
          cp -f machino/docs/install-openipc.md        "$O/INSTALL.md"

          # Die WLAN-Nutzlast. HIER ist sie Pflicht, anders als im
          # Entwicklungsbuild: ein Release, das eine WLAN-Umschaltung in der
          # Oberflaeche anbietet und den Treiber dazu nicht mitliefert, ist ein
          # Versprechen, das die Kamera nicht halten kann. Lieber kein Release.
          mkdir -p "$O/wifi/modules" "$O/wifi/firmware"
          find wifi-payload -name '*.ko'    -exec cp -f {} "$O/wifi/modules/" \; 2>/dev/null || true
          find wifi-payload -name 'hostapd' -type f -exec cp -f {} "$O/wifi/hostapd" \; 2>/dev/null || true
          # NUR aic8800DC: ein "aic8800*"-Glob nimmt das Artefaktverzeichnis
          # aic8800-t40 mit, und die Firmware fuer D80/D80X2 liest diese
          # Kamera nie. Siehe build-machino-t40.yml.
          fwsrc=$(find wifi-payload -type d -name aic8800DC | head -1)
          if [ -n "$fwsrc" ]; then cp -r "$fwsrc" "$O/wifi/firmware/"; fi
          chmod 0755 "$O/wifi/hostapd" 2>/dev/null || true
          for f in "$O/wifi/modules/aic8800.ko" "$O/wifi/modules/aic_load_fw.ko" "$O/wifi/hostapd"; do
            [ -s "$f" ] || { echo "::error::the release bundle is missing $f -- run build-aic8800-t40 and build-hostapd-t40 first"; exit 1; }
          done
          [ "$(find "$O/wifi/firmware" -type f | wc -l)" -gt 0 ] ||
            { echo "::error::no WiFi firmware in the release bundle; the driver would bind and then fail"; exit 1; }

          chmod 0755 "$O/machino" "$O/install.sh" "$O/uninstall.sh" "$O/sbin/"* "$O/init/"*
          {
            echo "Machino commit:   $(git rev-parse HEAD) ($(git describe --tags --always --dirty))"
            echo "Built:            $(date -u +%Y-%m-%dT%H:%M:%SZ) by GitHub Actions run ${GITHUB_RUN_ID}"
            echo "SDK version:      Ingenic IMP $SDK_VERSION"
            echo "Toolchain:        $("$TC/mipsel-linux-g++" --version | head -1)"
            echo "Binary:           $(file -b "$O/machino")"
            echo
            echo "WiFi payload (installed by default, SWITCHED OFF by default):"
            echo "  modules:  $(ls "$O/wifi/modules" | tr '\n' ' ')"
            echo "  firmware: $(find "$O/wifi/firmware" -type f | wc -l) file(s)"
            echo "  hostapd:  $(file -b "$O/wifi/hostapd")"
            echo "  switch:   usb.wifi.enabled in machino.conf, default false;"
            echo "            takes effect at the next boot. With it off no module"
            echo "            is loaded and PB18 stays down, so the USB port is free."
          } > "$O/BUILDINFO"
          (cd "$O" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd bundle && tar czf machino-openipc-t40nn.tar.gz machino-openipc-t40nn)
          cat "$O/BUILDINFO"

      - name: "Release notes"
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo "## machino $TAG"
            echo
            echo "### Verified by this build"
            echo '```'
            cat "$RUNNER_TEMP/counts.txt"
            echo '```'
            echo "- cross-build for T40 (mipsel, musl) with \`-Werror\`"
            echo "- \`check-linux-only\` (nothing host-only leaked into the target build)"
            echo "- the make-free host runner is equivalent to \`make test\`"
            echo
            echo "### NOT verified by this build"
            echo
            echo "A green run here means the code builds and the host suite passes."
            echo "It says nothing about a camera. Everything below needs hardware,"
            echo "a browser or a separate CI job, and is listed so a release note"
            echo "cannot quietly claim more than was measured:"
            echo
            if [ -f machino/docs/pending-physical.md ]; then
              sed 's/^/> /' machino/docs/pending-physical.md
            else
              echo "> docs/pending-physical.md is missing from this tree."
            fi
            echo
            echo "### Checksums"
            echo '```'
            cat bundle/machino-openipc-t40nn/SHA256SUMS
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          head -40 "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            bundle/machino-openipc-t40nn.tar.gz
            bundle/machino-openipc-t40nn/SHA256SUMS
            bundle/machino-openipc-t40nn/BUILDINFO
          fail_on_unmatched_files: true
