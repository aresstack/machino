name: build-aic8800-t40
# AP35.19 / AP36: build the AIC8800 USB WiFi driver as a LOADABLE MODULE for
# the camera's existing kernel, and prove it would actually load.
#
# Why a module and not a kernel image: the camera runs a kernel we did not
# build and are not allowed to replace ("kein Kernelimage flashen"). AP35.19
# established that module-only is structurally possible on this box --
# CONFIG_MODVERSIONS=n, so there are no symbol CRCs and the entire ABI contract
# is the vermagic string. That makes the contract checkable in CI instead of
# discoverable by bricking a camera.
#
# What this job proves, and what it does not:
#
#   PROVEN here   the source compiles against 4.4.94/ingenic-t40 for mipsel,
#                 the resulting .ko carries the camera's exact vermagic, every
#                 undefined symbol it has is exported by that kernel build, and
#                 its declared dependencies exist
#   NOT proven    that the module binds the device, that the radio works, or
#                 that the board's USB power is on. Those need the camera and
#                 stay PENDING_PHYSICAL.
#
# A green run here is a licence to try `insmod` on a camera someone can power
# cycle. It is not a licence to ship.
on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "OpenIPC/linux ref to build against"
        required: false
        default: "ingenic-t40"
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-aic8800-t40.yml' ]

jobs:
  aic8800:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KERNEL_REPO: "https://github.com/OpenIPC/linux"
      KERNEL_REF: "${{ github.event.inputs.kernel_ref || 'ingenic-t40' }}"
      FIRMWARE_REPO: "https://github.com/OpenIPC/firmware"
      # The camera's own string, read off a loaded module on the device
      # (AP22, re-confirmed against tun.ko in AP34). This is the whole ABI
      # contract on a CONFIG_MODVERSIONS=n kernel, so it is a hard gate and
      # not a warning.
      WANT_VERMAGIC: "4.4.94 SMP preempt mod_unload MIPS32_R2 32BIT"
      ARCH: "mips"
      CROSS: "mipsel-linux-"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Install build dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev wget curl git rsync cpio unzip file kmod

      - name: "Fetch the mipsel toolchain"
        run: |
          set -eu
          # Through the repo's own build.sh, exactly as build-machino-t40 does.
          #
          # The first version of this step carried a hand-written release URL
          # and the run died on it -- a URL invented here is a second source of
          # truth for something the repo already knows, and it drifted before
          # it ever worked. build.sh pins the archive AND verifies its SHA256.
          #
          # A kernel module links no libc, so the musl userspace toolchain is
          # the right compiler for it; the vermagic gate below is what actually
          # decides whether the result will load.
          chmod +x build.sh
          ./build.sh deps T40 --libc-musl
          BIN=$(ls -d toolchain/*/*/bin 2>/dev/null | head -1)
          test -n "$BIN" || { echo "::error::build.sh produced no toolchain bin/"; ls -R toolchain | head -40; exit 1; }
          BIN="$PWD/$BIN"
          test -x "$BIN/${CROSS}gcc" || { echo "::error::no ${CROSS}gcc in $BIN"; ls "$BIN" | head -20; exit 1; }
          echo "$BIN" >> "$GITHUB_PATH"
          echo "TC_BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/${CROSS}gcc" --version | head -1

      - name: "Fetch the kernel source (OpenIPC/linux @ ${{ env.KERNEL_REF }})"
        run: |
          set -eu
          git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_REPO" "$RUNNER_TEMP/linux"
          echo "kernel commit: $(git -C "$RUNNER_TEMP/linux" rev-parse HEAD)"
          V=$(make -s -C "$RUNNER_TEMP/linux" kernelversion)
          echo "kernelversion: $V"
          case "$V" in
            4.4.94*) ;;
            *) echo "::error::this branch is $V, the camera runs 4.4.94 -- a module built here would not load"; exit 1 ;;
          esac

      - name: "Find the board's kernel config in OpenIPC/firmware"
        run: |
          set -eu
          git clone --depth 1 --filter=blob:none --sparse "$FIRMWARE_REPO" "$RUNNER_TEMP/fw"
          git -C "$RUNNER_TEMP/fw" sparse-checkout set general/package/aic8800-openipc br-ext-chip-ingenic
          # The config is the one the camera's own kernel was built from. Using
          # a defconfig we made up would produce a different vermagic and a
          # module that refuses to load -- which the vermagic gate below would
          # catch, but late and with a confusing message.
          # Parenthesised: without the grouping the -o would make the second
          # pattern match anywhere in the tree, and the first T40-looking file
          # found would be used no matter what it is.
          CFG=$(find "$RUNNER_TEMP/fw" \( -name '*t40*.config' -o -name '*t40*defconfig' \) -print 2>/dev/null | sort | head -1 || true)
          if [ -z "$CFG" ]; then
            echo "::error::no T40 kernel config found under br-ext-chip-ingenic."
            echo "::error::Refusing to substitute a guess: a config we invented gives a"
            echo "::error::different vermagic and a module that cannot load on the camera."
            exit 1
          fi
          echo "kernel config: $CFG"
          echo "KCONFIG=$CFG" >> "$GITHUB_ENV"

      - name: "Resolve the aic8800-openipc source from its Buildroot package"
        run: |
          set -eu
          MK="$RUNNER_TEMP/fw/general/package/aic8800-openipc/aic8800-openipc.mk"
          test -f "$MK" || { echo "::error::no aic8800-openipc package in OpenIPC/firmware"; exit 1; }
          echo "--- $MK"
          cat "$MK"
          # Read the upstream out of the package rather than hardcoding a URL:
          # the package is the authority on which fork and which commit OpenIPC
          # actually ships, and a URL pinned here would silently drift from it.
          SITE=$(sed -n 's/^AIC8800_OPENIPC_SITE *= *//p' "$MK" | head -1)
          VER=$(sed -n 's/^AIC8800_OPENIPC_VERSION *= *//p' "$MK" | head -1)
          test -n "$SITE" || { echo "::error::the package declares no _SITE"; exit 1; }
          test -n "$VER"  || { echo "::error::the package declares no _VERSION"; exit 1; }
          echo "site=$SITE version=$VER"
          git clone "$SITE" "$RUNNER_TEMP/aic8800"
          git -C "$RUNNER_TEMP/aic8800" checkout "$VER"
          echo "AIC_SRC=$RUNNER_TEMP/aic8800" >> "$GITHUB_ENV"

      - name: "Prepare the kernel tree (modules_prepare only, no full image)"
        run: |
          set -eu
          cd "$RUNNER_TEMP/linux"
          cp "$KCONFIG" .config
          # A module needs a configured, prepared tree with the same options --
          # not a built image. The camera's kernel is not being replaced.
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS" olddefconfig
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS" -j"$(nproc)" modules_prepare
          grep -q '^CONFIG_MODVERSIONS=y' .config && {
            echo "::warning::this config has MODVERSIONS on; the camera's does not."
            echo "::warning::symbol CRCs would then also have to match, not just vermagic."
          } || echo "MODVERSIONS off, as on the camera: vermagic is the whole contract"

      - name: "Build the module"
        run: |
          set -eu
          make -C "$RUNNER_TEMP/linux" ARCH="$ARCH" CROSS_COMPILE="$CROSS" \
               M="$AIC_SRC" -j"$(nproc)" modules
          find "$AIC_SRC" -name '*.ko' -printf '%p  %s bytes\n'
          test -n "$(find "$AIC_SRC" -name '*.ko' -print -quit)" || {
            echo "::error::the build produced no .ko"; exit 1; }

      - name: "Gate: vermagic must be the camera's, exactly"
        run: |
          set -eu
          fail=0
          for ko in $(find "$AIC_SRC" -name '*.ko'); do
            got=$(modinfo -F vermagic "$ko")
            echo "$(basename "$ko"): $got"
            if [ "$got" != "$WANT_VERMAGIC" ]; then
              echo "::error::$(basename "$ko") vermagic is '$got', the camera wants '$WANT_VERMAGIC'"
              echo "::error::insmod would refuse this module with 'Invalid module format'"
              fail=1
            fi
          done
          exit $fail

      - name: "Gate: every undefined symbol is exported by this kernel"
        run: |
          set -eu
          SYMVERS="$RUNNER_TEMP/linux/Module.symvers"
          test -f "$SYMVERS" || { echo "::error::no Module.symvers"; exit 1; }
          # The kernel's own exports, plus the exports of the other modules
          # built from this tree -- a symbol provided by a module we also ship
          # is fine, it is a load ORDER question and not a missing symbol.
          awk '{print $2}' "$SYMVERS" > "$RUNNER_TEMP/exported.txt"
          if [ -f "$AIC_SRC/Module.symvers" ]; then
            awk '{print $2}' "$AIC_SRC/Module.symvers" >> "$RUNNER_TEMP/exported.txt"
          fi
          sort -u -o "$RUNNER_TEMP/exported.txt" "$RUNNER_TEMP/exported.txt"

          fail=0
          for ko in $(find "$AIC_SRC" -name '*.ko'); do
            "${CROSS}nm" -u "$ko" | awk '{print $2}' | grep -v '^$' | sort -u > "$RUNNER_TEMP/undef.txt"
            missing=$(comm -23 "$RUNNER_TEMP/undef.txt" "$RUNNER_TEMP/exported.txt" || true)
            if [ -n "$missing" ]; then
              echo "::error::$(basename "$ko") needs symbols this kernel does not export:"
              echo "$missing" | sed 's/^/  /'
              fail=1
            else
              echo "$(basename "$ko"): all undefined symbols are exported"
            fi
          done
          exit $fail

      - name: "Report: declared dependencies and firmware blobs"
        run: |
          set -eu
          for ko in $(find "$AIC_SRC" -name '*.ko'); do
            echo "--- $(basename "$ko")"
            echo "  depends:  $(modinfo -F depends "$ko")"
            echo "  alias:    $(modinfo -F alias "$ko" | tr '\n' ' ')"
            echo "  firmware: $(modinfo -F firmware "$ko" | tr '\n' ' ')"
          done
          # a69c:88dc is the AIC8800DC this camera actually enumerated
          # (AP35, measured). If no alias matches it, the module will build,
          # load and then never bind -- which looks exactly like a dead radio.
          if find "$AIC_SRC" -name '*.ko' -exec modinfo -F alias {} + | grep -qi 'v0000A69Cp000088DC'; then
            echo "alias matches the enumerated device a69c:88dc"
          else
            echo "::warning::no alias for a69c:88dc -- the module may load without binding the device."
            echo "::warning::That is a real risk on this board and must be checked on hardware."
          fi

      - name: "Bundle"
        run: |
          set -eu
          B=bundle/aic8800-t40; mkdir -p "$B/modules"
          find "$AIC_SRC" -name '*.ko' -exec cp {} "$B/modules/" \;
          # Firmware blobs are not optional: the chip loads its own image at
          # probe time and a module without them binds and then fails.
          find "$AIC_SRC" -type d -name 'fw*' -o -type d -name 'firmware' | while read -r d; do
            cp -r "$d" "$B/" || true
          done
          {
            echo "AIC8800 module for the OpenIPC T40 kernel"
            echo
            echo "kernel:      $KERNEL_REPO @ $KERNEL_REF ($(git -C "$RUNNER_TEMP/linux" rev-parse HEAD))"
            echo "config:      $KCONFIG"
            echo "source:      $(git -C "$AIC_SRC" remote get-url origin) @ $(git -C "$AIC_SRC" rev-parse HEAD)"
            echo "toolchain:   $("${CROSS}gcc" --version | head -1)"
            echo "vermagic:    $WANT_VERMAGIC (verified against every .ko)"
            echo "built:       $(date -u +%Y-%m-%dT%H:%M:%SZ) by run ${GITHUB_RUN_ID}"
            echo
            echo "NOT VERIFIED HERE: that the module binds the device, that the"
            echo "radio works, or that USB port power is on. Load it only on a"
            echo "camera someone can power cycle."
          } > "$B/BUILDINFO"
          (cd "$B" && find . -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS)
          cat "$B/BUILDINFO"

      - uses: actions/upload-artifact@v4
        with:
          name: aic8800-t40
          path: bundle/aic8800-t40
          if-no-files-found: error
