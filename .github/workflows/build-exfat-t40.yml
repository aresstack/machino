name: build-exfat-t40
# exFAT fuer die Kamera -- als Nutzlast, nicht als neues Image.
#
# Befund (docs/ap36-usb-storage.md, 2026-09-30): eine frische 128-GB-SDXC-Karte
# kommt ab Werk als exFAT, und der Kamera-Kernel (4.4.94, ingenic-t40) kennt
# nur fat/vfat. Bisher blieb nur "Format FAT32" -- mit 4-GB-Dateigrenze.
#
# Was hier entsteht:
#
#   exfat.ko     Samsung-exFAT-Treiber (exfat-nofuse, der Android-Treiber fuer
#                3.x/4.x-Kernel), out-of-tree gegen GENAU diesen Kernelbaum und
#                GENAU diese Konfiguration uebersetzt -- derselbe Modul-only-Weg
#                wie bei Modem und USB-Speicher, dieselben drei Gates.
#   mkfs.exfat   aus exfatprogs, fuer mipsel/musl gebaut, damit die Storage-
#                Seite eine Karte auch als exFAT formatieren kann (busybox hat
#                nur mkfs.vfat). Dynamisch gegen die musl der Kamera wie
#                machino selbst, non-PIE.
#
# install.sh legt beides nur auf Wunsch ab (--with-exfat, Cam-Tool: exFAT):
# das Modul inert unter /etc/machino/modules, der USB-Helfer laedt es VOR
# usb-storage, damit mdevs Automount ("vfat exfat ...") ein exFAT-Medium beim
# Einstecken schon mounten kann.
#
# Was dieser Job beweist und was nicht:
#
#   BEWIESEN     das Modul uebersetzt gegen 4.4.94/ingenic-t40 fuer mipsel,
#                traegt exakt den vermagic der Kamera, und jedes undefinierte
#                Symbol wird von diesem Kernel exportiert (Liste VON DER
#                KAMERA); mkfs.exfat ist ein MIPS32r2-Binary, das nur libc
#                braucht.
#   NICHT        dass die Kamera ein exFAT-Medium mountet oder mkfs.exfat
#                darauf ein Dateisystem schreibt, das Windows liest. Das
#                braucht die Hardware: docs/pending-physical.md B9.
on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "OpenIPC/linux ref to build against"
        required: false
        default: "ingenic-t40"
      exfat_ref:
        description: "exfat-nofuse commit to build"
        required: false
        default: "01c30ad52625a7261e1b0d874553b6ca7af25966"
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-exfat-t40.yml' ]

permissions:
  contents: read

jobs:
  exfat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KERNEL_REPO: "https://github.com/OpenIPC/linux"
      KERNEL_REF: "${{ github.event.inputs.kernel_ref || 'ingenic-t40' }}"
      FIRMWARE_REPO: "https://github.com/OpenIPC/firmware"
      # Der Samsung-Treiber, wie er jahrelang auf Android-Kerneln 3.x/4.x lief.
      # Festgenagelt auf einen Commit: ein Treiber, der Dateisysteme schreibt,
      # wechselt nicht stillschweigend die Version.
      EXFAT_REPO: "https://github.com/dorimanx/exfat-nofuse"
      EXFAT_REF: "${{ github.event.inputs.exfat_ref || '01c30ad52625a7261e1b0d874553b6ca7af25966' }}"
      EXFATPROGS_REPO: "https://github.com/exfatprogs/exfatprogs"
      EXFATPROGS_REF: "1.2.9"
      # Der String der Kamera, von einem geladenen Modul abgelesen. Auf einem
      # CONFIG_MODVERSIONS=n-Kernel ist er der ganze ABI-Vertrag.
      WANT_VERMAGIC: "4.4.94 SMP preempt mod_unload MIPS32_R2 32BIT"
      ARCH: "mips"
      CROSS: "mipsel-linux-"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Dependencies"
        run: sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev kmod file wget curl git autoconf automake libtool pkg-config

      - name: "Toolchain"
        run: |
          set -eu
          chmod +x build.sh
          ./build.sh deps T40 --libc-musl
          BIN=$(ls -d toolchain/*/*/bin 2>/dev/null | head -1)
          test -n "$BIN" || { echo "::error::no toolchain"; exit 1; }
          echo "$PWD/$BIN" >> "$GITHUB_PATH"
          "$PWD/$BIN/${CROSS}gcc" --version | head -1

      - name: "Fetch the kernel source (OpenIPC/linux @ ${{ env.KERNEL_REF }})"
        run: |
          set -eu
          git clone --depth 1 --branch "$KERNEL_REF" "$KERNEL_REPO" "$RUNNER_TEMP/linux"
          echo "kernel commit: $(git -C "$RUNNER_TEMP/linux" rev-parse HEAD)"
          V=$(make -s -C "$RUNNER_TEMP/linux" kernelversion)
          echo "kernelversion: $V"
          case "$V" in
            4.4.94*) ;;
            *) echo "::error::this branch is $V, the camera runs 4.4.94 -- a module built here would not load"; exit 1 ;;
          esac

      - name: "Find the board's kernel config in OpenIPC/firmware"
        run: |
          set -eu
          git clone --depth 1 --filter=blob:none --sparse "$FIRMWARE_REPO" "$RUNNER_TEMP/fw"
          git -C "$RUNNER_TEMP/fw" sparse-checkout set br-ext-chip-ingenic
          CFG=$(find "$RUNNER_TEMP/fw" \( -name '*t40*.config' -o -name '*t40*defconfig' \) -print 2>/dev/null | sort | head -1 || true)
          [ -n "$CFG" ] || { echo "::error::no T40 kernel config found under br-ext-chip-ingenic"; exit 1; }
          echo "kernel config: $CFG"
          echo "KCONFIG=$CFG" >> "$GITHUB_ENV"

      - name: "Prepare the kernel tree with the camera's configuration, unchanged"
        run: |
          set -eu
          cd "$RUNNER_TEMP/linux"
          cp "$KCONFIG" .config
          # Nichts wird eingeschaltet: ein Out-of-Tree-Modul braucht nur die
          # Header und die Konfiguration des Kernels, gegen den es laedt. NLS
          # (Zeichentabellen fuer Dateinamen) muss der Kernel schon haben --
          # die Kamera hat sie fest eingebaut, sonst gaebe es auch kein vfat.
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS" olddefconfig
          grep -E "CONFIG_NLS=|CONFIG_NLS_UTF8|CONFIG_NLS_CODEPAGE_437|CONFIG_MODVERSIONS|CONFIG_FAT_FS|CONFIG_VFAT_FS" .config || true
          grep -q "^CONFIG_NLS=y" .config || { echo "::error::CONFIG_NLS is not built in -- the exFAT driver would have no character tables"; exit 1; }
          if grep -q "^CONFIG_MODVERSIONS=y" .config; then
            echo "::error::CONFIG_MODVERSIONS=y in this config -- symbol CRCs would have to match too, not just vermagic"
            exit 1
          fi
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS" -j"$(nproc)" modules_prepare

      - name: "Fetch and build the exFAT driver (exfat-nofuse @ ${{ env.EXFAT_REF }})"
        run: |
          set -eu
          git clone "$EXFAT_REPO" "$RUNNER_TEMP/exfat"
          git -C "$RUNNER_TEMP/exfat" checkout --detach "$EXFAT_REF"
          echo "exfat commit: $(git -C "$RUNNER_TEMP/exfat" rev-parse HEAD)"
          cd "$RUNNER_TEMP/linux"
          # Der Makefile des Treibers haengt an obj-$(CONFIG_EXFAT_FS); der
          # Kamera-Kernel kennt das Symbol nicht, also kommt es von hier.
          make ARCH="$ARCH" CROSS_COMPILE="$CROSS" -j"$(nproc)" M="$RUNNER_TEMP/exfat" CONFIG_EXFAT_FS=m modules
          ls -l "$RUNNER_TEMP/exfat/exfat.ko"

      - name: "Gate: vermagic must be the camera's, exactly"
        run: |
          set -eu
          trim() { printf '%s' "$1" | sed 's/[[:space:]]*$//'; }
          want=$(trim "$WANT_VERMAGIC")
          raw=$(modinfo -F vermagic "$RUNNER_TEMP/exfat/exfat.ko")
          got=$(trim "$raw")
          echo "exfat.ko: [$raw]"
          if [ "$got" != "$want" ]; then
            echo "::error::exfat.ko vermagic is '$got', the camera wants '$want'"
            exit 1
          fi
          echo "description: $(modinfo -F description "$RUNNER_TEMP/exfat/exfat.ko")"
          echo "license:     $(modinfo -F license "$RUNNER_TEMP/exfat/exfat.ko")"

      - name: "Gate: every undefined symbol is exported by the camera's kernel"
        run: |
          set -eu
          CAM="$GITHUB_WORKSPACE/machino/tools/kernel/t40nn-exported-symbols.txt"
          test -s "$CAM" || { echo "::error::no captured symbol list at $CAM"; exit 1; }
          n=$(wc -l < "$CAM"); echo "camera exports: $n symbols"
          [ "$n" -gt 2000 ] || { echo "::error::only $n symbols -- the capture looks truncated"; exit 1; }
          sort -u "$CAM" > /tmp/cam.sorted
          "${CROSS}nm" -u "$RUNNER_TEMP/exfat/exfat.ko" 2>/dev/null | awk '{print $2}' | sort -u > /tmp/need
          grep -vE '^(__this_module|__gnu_|_gp_disp|__mips)' /tmp/need > /tmp/need2 || true
          echo "exfat.ko needs $(wc -l < /tmp/need2) symbols"
          missing=$(comm -23 /tmp/need2 /tmp/cam.sorted || true)
          if [ -n "$missing" ]; then
            echo "::error::exfat.ko needs symbols this kernel does not export:"
            echo "$missing" | sed 's/^/    /'
            exit 1
          fi
          echo "  exfat.ko: all undefined symbols are exported"

      - name: "Build mkfs.exfat (exfatprogs @ ${{ env.EXFATPROGS_REF }}) for mipsel/musl"
        run: |
          set -eu
          git clone --depth 1 --branch "$EXFATPROGS_REF" "$EXFATPROGS_REPO" "$RUNNER_TEMP/exfatprogs"
          cd "$RUNNER_TEMP/exfatprogs"
          ./autogen.sh
          # Wie machino selbst: dynamisch gegen die musl der Kamera (dieselbe
          # Toolchain, dieselbe libc), non-PIE, -Os. Statisch waere doppelt so
          # gross, und jedes kB Overlay zaehlt auf dieser Kamera.
          ./configure --host=mipsel-linux CC="${CROSS}gcc" CFLAGS="-Os -fno-pie" LDFLAGS="-no-pie"
          make -j"$(nproc)"
          "${CROSS}strip" mkfs/mkfs.exfat
          file mkfs/mkfs.exfat
          ls -l mkfs/mkfs.exfat

      - name: "Gate: mkfs.exfat is a MIPS32 binary that needs only libc"
        run: |
          set -eu
          f="$RUNNER_TEMP/exfatprogs/mkfs/mkfs.exfat"
          file "$f" | grep -q "MIPS" || { echo "::error::mkfs.exfat is not a MIPS binary: $(file "$f")"; exit 1; }
          needed=$("${CROSS}readelf" -d "$f" | awk '/NEEDED/{print $NF}' | tr -d '[]')
          echo "NEEDED: $needed"
          for lib in $needed; do
            case "$lib" in
              libc.so) ;;
              *) echo "::error::mkfs.exfat needs $lib -- the camera only has musl's libc.so"; exit 1 ;;
            esac
          done

      - name: "Bundle"
        run: |
          set -eu
          B=bundle/exfat-t40; mkdir -p "$B"
          cp "$RUNNER_TEMP/exfat/exfat.ko" "$B/exfat.ko"
          "${CROSS}strip" --strip-debug "$B/exfat.ko"
          cp "$RUNNER_TEMP/exfatprogs/mkfs/mkfs.exfat" "$B/mkfs.exfat"
          {
            echo "exFAT payload for the OpenIPC T40 camera: kernel module + mkfs.exfat"
            echo
            echo "kernel:     $KERNEL_REPO @ $KERNEL_REF ($(git -C "$RUNNER_TEMP/linux" rev-parse HEAD))"
            echo "config:     $KCONFIG"
            echo "driver:     $EXFAT_REPO @ $(git -C "$RUNNER_TEMP/exfat" rev-parse HEAD)"
            echo "exfatprogs: $EXFATPROGS_REPO @ $EXFATPROGS_REF"
            echo "toolchain:  $(${CROSS}gcc --version | head -1)"
            echo "vermagic:   $WANT_VERMAGIC (verified)"
            echo "built:      $(date -u +%Y-%m-%dT%H:%M:%SZ) by run ${GITHUB_RUN_ID}"
            echo
            echo "Installed only with --with-exfat (Cam-Tool: exFAT). The module goes to"
            echo "/etc/machino/modules/exfat.ko and is loaded by machino-usb-helper BEFORE"
            echo "usb-storage when usb.storage=true, so OpenIPC's mdev automount (which"
            echo "tries 'vfat exfat ...') can mount an exFAT card the moment it appears."
            echo "mkfs.exfat goes to /usr/sbin; the Storage page offers 'Format exFAT'"
            echo "next to 'Format FAT32'."
            echo
            echo "NOT VERIFIED HERE: that the camera mounts an exFAT medium, or that a"
            echo "volume written by this mkfs.exfat is read by Windows/macOS. Hardware."
          } > "$B/BUILDINFO"
          (cd "$B" && sha256sum exfat.ko mkfs.exfat BUILDINFO > SHA256SUMS)
          cat "$B/BUILDINFO"; echo; ls -l "$B"

      - uses: actions/upload-artifact@v4
        with:
          name: exfat-t40
          path: bundle/exfat-t40
          if-no-files-found: error
