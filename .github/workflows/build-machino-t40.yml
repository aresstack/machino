name: build-machino-t40
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-machino-t40.yml', 'machino/**', 'build.sh' ]
permissions:
  contents: read
  actions: read          # gh run download holt die WLAN-Nutzlast aus den
                        # Workflows build-aic8800-t40 und build-hostapd-t40

jobs:
  machino-t40:
    runs-on: ubuntu-latest
    env:
      SDK_VERSION: "1.3.1"
      SOC: "T40"
    steps:
      - name: "Checkout with submodules (ingenic-headers)"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Install build dependencies"
        run: sudo apt-get update && sudo apt-get install -y build-essential wget curl git python3 xxd rsync bc cpio unzip file ccache
      - name: "Fetch and build mbedTLS (pinned; WebRTC DTLS handshake)"
        run: sh machino/tools/fetch-mbedtls.sh "$PWD/3p" gcc ar
      - name: "Host unit tests (board profiles, precedence, capabilities, Ingenic conversion)"
        run: make -C machino test MBEDTLS="$PWD/3p/mbedtls-3.6.7"
      - name: "The make-free host runner must stay equivalent to `make test`"
        run: |
          # tools/host-test.sh exists for environments with a compiler but no
          # make. It reads TEST_SRC out of the Makefile so it cannot carry a
          # second file list, but nothing else stops it from rotting -- so it
          # is run here too. Same sources, same flags, same assertions.
          rm -rf machino/build machino/tests/machino-tests
          sh machino/tools/host-test.sh "$PWD/3p/mbedtls-3.6.7"
      - name: "The network page must at least parse"
        # Die Seite ist ein String in C++: der Compiler prueft sie nicht, und
        # ein fehlendes Komma im JavaScript zerlegt nicht die eine Schaltflaeche,
        # sondern den ganzen <script>-Block -- also die ganze Seite. Das faellt
        # sonst erst in einem Browser auf, und der ist hier selten zur Hand.
        run: sh machino/tools/check-netui.sh machino/src/app/http/netui.cpp

      - name: "Fetch toolchain and vendor IMP libraries (T40 musl, SDK 1.3.1)"
        run: |
          chmod +x build.sh
          ./build.sh deps "$SOC" --libc-musl
          test -d "include/$SOC/$SDK_VERSION/en/imp" || { echo "SDK headers $SDK_VERSION missing"; exit 1; }
          grep -q "lib/$SDK_VERSION/" 3rdparty/install/.soc || { echo "vendor libs are not SDK $SDK_VERSION: $(cat 3rdparty/install/.soc)"; exit 1; }
      - name: "Build machino (C++, T40 musl, -Werror, static vendor libs)"
        run: |
          TC=$(ls -d toolchain/xburst2-musl/*/bin | head -1)
          echo "toolchain bin: $TC"
          sh machino/tools/fetch-mbedtls.sh "$PWD/3p" "$PWD/$TC/mipsel-linux-gcc" "$PWD/$TC/mipsel-linux-ar"
          make -C machino -j"$(nproc)" WERROR=1 \
            MBEDTLS="$PWD/3p/mbedtls-3.6.7" \
            CROSS_COMPILE="$PWD/$TC/mipsel-linux-" \
            PLATFORM="$SOC" \
            IMP_INC="$PWD/include/$SOC/$SDK_VERSION/en" \
            IMP_LIB="$PWD/3rdparty/install/lib" \
            IMPLIBS="-Wl,--start-group -l:libimp.a -l:libalog.a -l:libsysutils.a -Wl,--end-group -l:libmuslshim.a"
          make -C machino MBEDTLS="$PWD/3p/mbedtls-3.6.7" CROSS_COMPILE="$PWD/$TC/mipsel-linux-" strip
      - name: "Hardware test bundle (machino-m2-t40: machino, machino.conf, required-libs, SHA256SUMS, BUILDINFO)"
        run: |
          TC=$(ls -d toolchain/xburst2-musl/*/bin | head -1)
          B=bundle/machino-m2-t40; mkdir -p "$B/required-libs"
          cp -f machino/machinod "$B/machino"
          cp -f machino/machino.conf.example "$B/machino.conf"
          NEEDED=$(readelf -d "$B/machino" | awk '/NEEDED/{print $5}' | tr -d '[]' | tr '\n' ' ')
          {
            echo "# runtime shared libraries required on the camera (from readelf NEEDED)"
            echo "# vendor IMP libs (libimp/libalog/libsysutils, SDK $SDK_VERSION) and libstdc++ are linked statically"
            echo "${NEEDED:-none}"
          } > "$B/required-libs/NEEDED.txt"
          {
            echo "Machino commit:   $(git rev-parse HEAD) ($(git describe --tags --always --dirty))"
            echo "Built:            $(date -u +%Y-%m-%dT%H:%M:%SZ) by GitHub Actions run ${GITHUB_RUN_ID}"
            echo "SDK version:      Ingenic IMP $SDK_VERSION (headers include/$SOC/$SDK_VERSION/en @ $(git -C include rev-parse --short HEAD); vendor libs $(cat 3rdparty/install/.soc))"
            echo "Toolchain:        thingino-toolchain-x86_64_xburst2_musl_gcc15-linux-mipsel -> $("$TC/mipsel-linux-g++" --version | head -1)"
            echo "libc:             musl (thingino xburst2 musl SDK; libmuslshim linked)"
            echo "Target/platform:  $SOC / T40NN (xburst2, MIPS32r2 little-endian, soft-float o32); board profiles: see machino/docs/architecture/board-profiles.md"
            echo "Binary:           $(file -b "$B/machino")"
            echo "Runtime NEEDED:   ${NEEDED:-none}"
            make -s -C machino flags PLATFORM="$SOC" IMP_INC="$PWD/include/$SOC/$SDK_VERSION/en" IMPLIBS="-Wl,--start-group -l:libimp.a -l:libalog.a -l:libsysutils.a -Wl,--end-group -l:libmuslshim.a" | sed 's/^/Compiler flags:   /'
          } > "$B/BUILDINFO"
          (cd "$B" && sha256sum machino machino.conf BUILDINFO required-libs/NEEDED.txt > SHA256SUMS)
          cat "$B/BUILDINFO"; echo; cat "$B/SHA256SUMS"; ls -l "$B"
      - name: "Upload bundle"
        uses: actions/upload-artifact@v4
        with:
          name: machino-m2-t40
          path: bundle/machino-m2-t40
      - name: "USB payloads (WiFi driver+firmware+hostapd, modem kernel modules)"
        # Warum geholt und nicht hier gebaut: die Module brauchen einen
        # Kernelbaum und hostapd eine eigene libnl-Kette. Beides in jeden
        # machino-Build zu ziehen wuerde ihn um Groessenordnungen verlangsamen,
        # obwohl sich an beidem fast nie etwas aendert.
        #
        # Es ist BEST EFFORT und zwar mit Absicht: die Artefakte laufen nach 90
        # Tagen ab, und ein abgelaufenes Artefakt darf nicht den Hauptbuild rot
        # machen, der mit WLAN nichts zu tun hat. Fehlt die Nutzlast, sagt das
        # Bundle es in der BUILDINFO, und install.sh meldet "nothing to load"
        # statt stillschweigend einen Schalter zu installieren, der nichts tut.
        # Das Release-Artefakt haelt es strenger.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p wifi-payload
          for wf in build-aic8800-t40.yml build-hostapd-t40.yml build-modem-modules-t40.yml; do
            id=$(gh run list --workflow "$wf" --status success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
            if [ -z "${id:-}" ] || [ "$id" = "null" ]; then
              echo "::warning::no successful run of $wf to take a payload from"
              continue
            fi
            echo "$wf -> run $id"
            gh run download "$id" -D "wifi-payload/$wf" 2>/dev/null || \
              echo "::warning::run $id of $wf has no downloadable artifact (expired?)"
          done
          find wifi-payload -type f | head -50 || true

      - name: "OpenIPC install bundle (machino-openipc-t40nn.tar.gz)"
        run: |
          O=bundle/machino-openipc-t40nn
          mkdir -p "$O/sbin" "$O/init"
          cp -f machino/machinod                       "$O/machino"
          cp -f machino/machino.conf.example           "$O/machino.conf"
          cp -f machino/openipc/install.sh             "$O/install.sh"
          cp -f machino/openipc/uninstall.sh           "$O/uninstall.sh"
          cp -f machino/openipc/sbin/streamerctl       "$O/sbin/streamerctl"
          cp -f machino/openipc/sbin/machino-manager   "$O/sbin/machino-manager"
          cp -f machino/openipc/init/S95streamer       "$O/init/S95streamer"
          cp -f machino/openipc/init/machino           "$O/init/machino"
          # WLAN. install.sh legt das per Default ab und laesst es
          # ausgeschaltet -- usb.wifi.enabled ist false, und S42wifi kehrt
          # dann sofort zurueck, ohne ein Modul zu laden.
          #
          # S41hostapd stand hier frueher und gibt es nicht mehr. Der Access
          # Point ist keine eigene Init-Stufe, sondern eine ROLLE, die der
          # Supervisor umschaltet -- Station und AP sind auf diesem Radio
          # gegenseitig, der Treiber macht daraus einen change_if. Die Zeile
          # ist mitgewandert, ohne dass jemand sie angefasst hat, und hat den
          # Bundle-Schritt zerlegt.
          #
          # Und der Supervisor fehlte: install.sh --with-wifi installiert ihn
          # zwingend und waere mit "cannot install machino-wifi-role"
          # gestorben. Das Bundle liefert ihn jetzt.
          cp -f machino/openipc/init/S42wifi           "$O/init/S42wifi"
          cp -f machino/openipc/sbin/machino-wifi-role "$O/sbin/machino-wifi-role"
          cp -f machino/openipc/udhcpc-wlan.script     "$O/udhcpc-wlan.script"

          # Mobilfunk. Dieselbe Regel wie beim WLAN: mitgeliefert und
          # ausgeschaltet. Die Kernelmodule kommen aus build-modem-modules-t40,
          # und wie bei der WLAN-Nutzlast ist das best effort -- ein
          # abgelaufenes Artefakt darf den Hauptbuild nicht rot machen.
          cp -f machino/openipc/sbin/machino-cellular-helper "$O/sbin/machino-cellular-helper"
          cp -f machino/openipc/udhcpc-cellular.script       "$O/udhcpc-cellular.script"
          mkdir -p "$O/cellular/modules"
          for m in option usb_wwan usbnet cdc_ether; do
            f=$(find wifi-payload -name "$m.ko" 2>/dev/null | head -1)
            if [ -n "$f" ]; then cp -f "$f" "$O/cellular/modules/"; fi
          done
          {
            echo "# Cellular payload in this bundle"
            echo "modules: $(ls "$O/cellular/modules" 2>/dev/null | tr '\n' ' ' || echo none)"
            echo
            echo "Installed by default and inert: nothing starts the helper"
            echo "until the USB function is set to cellular."
          } > "$O/cellular/PAYLOAD.txt"
          cat "$O/cellular/PAYLOAD.txt"

          # Die WLAN-Nutzlast. install.sh legt sie per Default ab und laesst
          # sie ausgeschaltet -- ohne diese Dateien waere der Schalter in der
          # Machino-UI eine Attrappe, weil niemand per Web-Klick ein
          # Kernelmodul nachliefern kann.
          mkdir -p "$O/wifi/modules" "$O/wifi/firmware"
          # NUR die WLAN-Module. Seit hier auch die Modem-Module heruntergeladen
          # werden, faengt ein '*.ko'-Glob option.ko und cdc_ether.ko mit ein --
          # die laegen dann unter wifi/modules und wuerden mitinstalliert,
          # sobald jemand WLAN benutzt.
          for m in aic8800 aic_load_fw; do
            f=$(find wifi-payload -name "$m.ko" 2>/dev/null | head -1)
            if [ -n "$f" ]; then cp -f "$f" "$O/wifi/modules/"; fi
          done
          find wifi-payload -name 'hostapd'  -type f -exec cp -f {} "$O/wifi/hostapd" \; 2>/dev/null || true
          # NUR aic8800DC. Ein "aic8800*"-Glob hat hier zuerst das
          # ARTEFAKTVERZEICHNIS aic8800-t40 mitgenommen und das Bundle auf
          # 9,4 MB aufgeblasen -- mehr als das Overlay der Kamera insgesamt hat.
          # Der Upstream-Treiber bringt Firmware fuer D, DC, D80 und D80X2 mit;
          # dieses Board ist ein DC, und die anderen drei waeren gut 3 MB, die
          # nie gelesen werden.
          fwsrc=$(find wifi-payload -type d -name aic8800DC | head -1)
          if [ -n "$fwsrc" ]; then cp -r "$fwsrc" "$O/wifi/firmware/"; fi
          chmod 0755 "$O/wifi/hostapd" 2>/dev/null || true
          {
            echo "# WiFi payload in this bundle"
            echo "modules:  $(ls "$O/wifi/modules" 2>/dev/null | tr '\n' ' ' || echo none)"
            echo "firmware: $(find "$O/wifi/firmware" -type f 2>/dev/null | wc -l) file(s)"
            echo "hostapd:  $([ -f "$O/wifi/hostapd" ] && echo yes || echo NO)"
            echo
            echo "Absent entries mean the matching workflow had no downloadable"
            echo "artifact when this ran -- install.sh reports it rather than"
            echo "installing a switch that cannot work."
          } > "$O/wifi/PAYLOAD.txt"
          cat "$O/wifi/PAYLOAD.txt"

          cp -f machino/openipc/README.md              "$O/README.md"
          cp -f machino/docs/install-openipc.md        "$O/INSTALL.md"
          chmod 0755 "$O/machino" "$O/install.sh" "$O/uninstall.sh" "$O/sbin/"* "$O/init/"*
          cp -f bundle/machino-m2-t40/BUILDINFO        "$O/BUILDINFO"
          (cd "$O" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd bundle && tar czf machino-openipc-t40nn.tar.gz machino-openipc-t40nn)
          ls -l bundle/machino-openipc-t40nn.tar.gz; cat "$O/SHA256SUMS"
      - name: "Upload OpenIPC install bundle"
        uses: actions/upload-artifact@v4
        with:
          name: machino-openipc-t40nn
          path: bundle/machino-openipc-t40nn.tar.gz
