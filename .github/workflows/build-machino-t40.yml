name: build-machino-t40
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-machino-t40.yml', 'machino/**', 'build.sh' ]
jobs:
  machinod-t40-musl:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout with submodules (ingenic-headers)"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Install build dependencies"
        run: sudo apt-get update && sudo apt-get install -y build-essential wget curl git python3 xxd rsync bc cpio unzip file ccache
      - name: "Fetch toolchain and vendor IMP libraries (T40 musl)"
        run: |
          chmod +x build.sh
          ./build.sh deps T40 --libc-musl
      - name: "Build machinod (C++ M2, T40 musl, static vendor libs)"
        run: |
          TC=$(ls -d toolchain/xburst2-musl/*/bin | head -1)
          echo "toolchain bin: $TC"
          make -C machino -j"$(nproc)" \
            CROSS_COMPILE="$PWD/$TC/mipsel-linux-" \
            PLATFORM=T40 \
            IMP_INC="$PWD/include/T40/1.3.1/en" \
            IMP_LIB="$PWD/3rdparty/install/lib" \
            IMPLIBS="-Wl,--start-group -l:libimp.a -l:libalog.a -l:libsysutils.a -Wl,--end-group -l:libmuslshim.a"
          make -C machino CROSS_COMPILE="$PWD/$TC/mipsel-linux-" strip
      - name: "Artifact info (size, type, sha256, NEEDED)"
        run: |
          cp -f machino/machinod machinod
          cp -f machino/machino.conf.example machino.conf.example
          ls -lh machinod
          file machinod
          sha256sum machinod | tee machinod.sha256
          readelf -d machinod 2>/dev/null | grep NEEDED || echo "no NEEDED (static)"
      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: machinod-t40nn-musl
          path: |
            machinod
            machinod.sha256
            machino.conf.example
