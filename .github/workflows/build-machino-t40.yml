name: build-machino-t40
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-machino-t40.yml', 'machino/**', 'build.sh' ]
jobs:
  machino-t40:
    runs-on: ubuntu-latest
    env:
      SDK_VERSION: "1.3.1"
      SOC: "T40"
    steps:
      - name: "Checkout with submodules (ingenic-headers)"
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: "Install build dependencies"
        run: sudo apt-get update && sudo apt-get install -y build-essential wget curl git python3 xxd rsync bc cpio unzip file ccache
      - name: "Host unit tests (board profiles, precedence, capabilities, Ingenic conversion)"
        run: make -C machino test
      - name: "Fetch toolchain and vendor IMP libraries (T40 musl, SDK 1.3.1)"
        run: |
          chmod +x build.sh
          ./build.sh deps "$SOC" --libc-musl
          test -d "include/$SOC/$SDK_VERSION/en/imp" || { echo "SDK headers $SDK_VERSION missing"; exit 1; }
          grep -q "lib/$SDK_VERSION/" 3rdparty/install/.soc || { echo "vendor libs are not SDK $SDK_VERSION: $(cat 3rdparty/install/.soc)"; exit 1; }
      - name: "Build machino (C++, T40 musl, -Werror, static vendor libs)"
        run: |
          TC=$(ls -d toolchain/xburst2-musl/*/bin | head -1)
          echo "toolchain bin: $TC"
          make -C machino -j"$(nproc)" WERROR=1 \
            CROSS_COMPILE="$PWD/$TC/mipsel-linux-" \
            PLATFORM="$SOC" \
            IMP_INC="$PWD/include/$SOC/$SDK_VERSION/en" \
            IMP_LIB="$PWD/3rdparty/install/lib" \
            IMPLIBS="-Wl,--start-group -l:libimp.a -l:libalog.a -l:libsysutils.a -Wl,--end-group -l:libmuslshim.a"
          make -C machino CROSS_COMPILE="$PWD/$TC/mipsel-linux-" strip
      - name: "Hardware test bundle (machino-m2-t40: machino, machino.conf, required-libs, SHA256SUMS, BUILDINFO)"
        run: |
          TC=$(ls -d toolchain/xburst2-musl/*/bin | head -1)
          B=bundle/machino-m2-t40; mkdir -p "$B/required-libs"
          cp -f machino/machinod "$B/machino"
          cp -f machino/machino.conf.example "$B/machino.conf"
          NEEDED=$(readelf -d "$B/machino" | awk '/NEEDED/{print $5}' | tr -d '[]' | tr '\n' ' ')
          {
            echo "# runtime shared libraries required on the camera (from readelf NEEDED)"
            echo "# vendor IMP libs (libimp/libalog/libsysutils, SDK $SDK_VERSION) and libstdc++ are linked statically"
            echo "${NEEDED:-none}"
          } > "$B/required-libs/NEEDED.txt"
          {
            echo "Machino commit:   $(git rev-parse HEAD) ($(git describe --tags --always --dirty))"
            echo "Built:            $(date -u +%Y-%m-%dT%H:%M:%SZ) by GitHub Actions run ${GITHUB_RUN_ID}"
            echo "SDK version:      Ingenic IMP $SDK_VERSION (headers include/$SOC/$SDK_VERSION/en @ $(git -C include rev-parse --short HEAD); vendor libs $(cat 3rdparty/install/.soc))"
            echo "Toolchain:        thingino-toolchain-x86_64_xburst2_musl_gcc15-linux-mipsel -> $("$TC/mipsel-linux-g++" --version | head -1)"
            echo "libc:             musl (thingino xburst2 musl SDK; libmuslshim linked)"
            echo "Target/platform:  $SOC / T40NN (xburst2, MIPS32r2 little-endian, soft-float o32); board profiles: see machino/docs/architecture/board-profiles.md"
            echo "Binary:           $(file -b "$B/machino")"
            echo "Runtime NEEDED:   ${NEEDED:-none}"
            make -s -C machino flags PLATFORM="$SOC" IMP_INC="$PWD/include/$SOC/$SDK_VERSION/en" IMPLIBS="-Wl,--start-group -l:libimp.a -l:libalog.a -l:libsysutils.a -Wl,--end-group -l:libmuslshim.a" | sed 's/^/Compiler flags:   /'
          } > "$B/BUILDINFO"
          (cd "$B" && sha256sum machino machino.conf BUILDINFO required-libs/NEEDED.txt > SHA256SUMS)
          cat "$B/BUILDINFO"; echo; cat "$B/SHA256SUMS"; ls -l "$B"
      - name: "Upload bundle"
        uses: actions/upload-artifact@v4
        with:
          name: machino-m2-t40
          path: bundle/machino-m2-t40
      - name: "OpenIPC install bundle (machino-openipc-t40nn.tar.gz)"
        run: |
          O=bundle/machino-openipc-t40nn
          mkdir -p "$O/sbin" "$O/init" "$O/webui"
          cp -f machino/machinod                       "$O/machino"
          cp -f machino/machino.conf.example           "$O/machino.conf"
          cp -f machino/openipc/install.sh             "$O/install.sh"
          cp -f machino/openipc/uninstall.sh           "$O/uninstall.sh"
          cp -f machino/openipc/sbin/streamerctl       "$O/sbin/streamerctl"
          cp -f machino/openipc/init/S95streamer       "$O/init/S95streamer"
          cp -f machino/openipc/init/machino           "$O/init/machino"
          cp -f machino/openipc/webui/machino.cgi      "$O/webui/machino.cgi"
          cp -f machino/openipc/README.md              "$O/README.md"
          cp -f machino/docs/install-openipc.md        "$O/INSTALL.md"
          chmod 0755 "$O/machino" "$O/install.sh" "$O/uninstall.sh" "$O/sbin/streamerctl" "$O/init/"* "$O/webui/machino.cgi"
          cp -f bundle/machino-m2-t40/BUILDINFO        "$O/BUILDINFO"
          (cd "$O" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd bundle && tar czf machino-openipc-t40nn.tar.gz machino-openipc-t40nn)
          ls -l bundle/machino-openipc-t40nn.tar.gz; cat "$O/SHA256SUMS"
      - name: "Upload OpenIPC install bundle"
        uses: actions/upload-artifact@v4
        with:
          name: machino-openipc-t40nn
          path: bundle/machino-openipc-t40nn.tar.gz
