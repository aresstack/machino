name: build-hostapd-t40
# hostapd fuer den T40, statisch gegen libnl gelinkt.
#
# Warum ueberhaupt: das OpenIPC-Image auf dieser Kamera hat KEIN hostapd. Ein
# Init-Skript und eine Konfiguration zu liefern, ohne das Binary, ergibt einen
# Access Point, der nie startet -- die API meldete bisher korrekt
# "hostapd is not in this image", und das bleibt so, bis das hier existiert.
#
# Statisch gelinkt, weil das Image kein libnl mitbringt und eine zusaetzliche
# Shared Library auf einem 8-MB-Overlay mehr Aerger macht als sie wert ist.
# CONFIG_TLS=internal: ohne OpenSSL auf dem Zielsystem, und WPA2-PSK/SAE
# brauchen kein TLS.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-hostapd-t40.yml' ]

jobs:
  hostapd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CROSS: "mipsel-linux-"
      HOSTAP_VER: "2.10"
      LIBNL_VER: "3.7.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "Dependencies"
        run: sudo apt-get update && sudo apt-get install -y build-essential wget curl git file pkg-config

      - name: "Toolchain"
        run: |
          set -eu
          chmod +x build.sh
          ./build.sh deps T40 --libc-musl
          BIN=$(ls -d toolchain/*/*/bin 2>/dev/null | head -1)
          test -n "$BIN" || { echo "::error::no toolchain"; exit 1; }
          BIN="$PWD/$BIN"
          echo "$BIN" >> "$GITHUB_PATH"
          echo "SYSROOT=$PWD/3p/sysroot" >> "$GITHUB_ENV"
          "$BIN/${CROSS}gcc" --version | head -1

      - name: "libnl (static)"
        run: |
          set -eu
          mkdir -p "$SYSROOT"
          cd "$RUNNER_TEMP"
          wget -q "https://github.com/thom311/libnl/releases/download/libnl$(echo $LIBNL_VER | tr . _)/libnl-$LIBNL_VER.tar.gz" -O libnl.tar.gz \
            || { echo "::error::libnl $LIBNL_VER could not be fetched"; exit 1; }
          tar xzf libnl.tar.gz && cd "libnl-$LIBNL_VER"
          # --disable-pthreads keeps it off a dependency musl provides
          # differently; nothing hostapd uses needs it.
          ./configure --host=mipsel-linux --prefix="$SYSROOT" \
                      --enable-static --disable-shared --disable-cli >/dev/null
          make -j"$(nproc)" >/dev/null
          make install >/dev/null
          ls -l "$SYSROOT/lib/libnl-3.a" "$SYSROOT/lib/libnl-genl-3.a"

      - name: "hostapd"
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          wget -q "https://w1.fi/releases/hostapd-$HOSTAP_VER.tar.gz" -O hostapd.tar.gz \
            || { echo "::error::hostapd $HOSTAP_VER could not be fetched"; exit 1; }
          tar xzf hostapd.tar.gz
          cd "hostapd-$HOSTAP_VER/hostapd"

          # Only what this camera needs.
          #
          # ABWESENHEIT schaltet ab, nicht "=n". hostapds Makefile prueft mit
          # ifdef, also AKTIVIERT CONFIG_WPS=n das WPS -- und CONFIG_SAE=n das
          # SAE. Der erste Anlauf hier hatte genau das, und der Link scheiterte
          # dann an crypto_bignum_*/crypto_ec_*, weil SAE eben doch gebaut
          # wurde. Was nicht drin sein soll, steht gar nicht erst da:
          #
          #   kein WPS, kein EAP, kein SAE/WPA3
          #
          # SAE braucht die EC-Schicht, die CONFIG_TLS=internal nicht hat. Mit
          # OpenSSL ginge es, aber das ist auf einem 8-MB-Overlay ein hoher
          # Preis fuer einen Kamera-Hotspot, den Telefone per WPA2 erreichen.
          cat > .config <<'CFG'
          CONFIG_DRIVER_NL80211=y
          CONFIG_LIBNL32=y
          CONFIG_IEEE80211N=y
          CONFIG_TLS=internal
          CONFIG_INTERNAL_LIBTOMMATH=y
          CONFIG_IEEE80211W=y
          CONFIG_CTRL_IFACE=y
          CONFIG_NO_RADIUS=y
          CONFIG_NO_ACCOUNTING=y
          CONFIG_NO_VLAN=y
          CONFIG_NO_DUMP_STATE=y
          CFG

          export CC="${CROSS}gcc"
          export CFLAGS="-Os -I$SYSROOT/include/libnl3"
          export LDFLAGS="-L$SYSROOT/lib -static"
          export LIBS="-lnl-genl-3 -lnl-3 -lm"
          # Nur hostapd. hostapd_cli waeren 150 KB auf einem Overlay mit 4,3 MB
          # frei, und niemand braucht sie: machino spricht den ctrl-Socket ueber
          # wpa_ctrl.cpp selbst an, und der Rollen-Supervisor startet hostapd
          # frisch, statt es fernzusteuern.
          make -j"$(nproc)" hostapd
          "${CROSS}strip" hostapd
          file hostapd
          ls -l hostapd

      - name: "Gate: it must be a 32-bit mipsel binary and not need a shared libnl"
        run: |
          set -eu
          H="$RUNNER_TEMP/hostapd-$HOSTAP_VER/hostapd/hostapd"
          file "$H" | grep -q "ELF 32-bit LSB.*MIPS" || {
            echo "::error::not a 32-bit MIPS binary: $(file -b "$H")"; exit 1; }
          # A dynamically linked libnl would need a library the camera does not
          # have, and the failure would only show at run time.
          if "${CROSS}readelf" -d "$H" 2>/dev/null | grep -q "libnl"; then
            echo "::error::hostapd still wants a shared libnl"; exit 1
          fi
          echo "needed: $(${CROSS}readelf -d "$H" 2>/dev/null | grep NEEDED || echo none)"

      - name: "Bundle"
        run: |
          set -eu
          B=bundle/hostapd-t40; mkdir -p "$B"
          cp "$RUNNER_TEMP/hostapd-$HOSTAP_VER/hostapd/hostapd" "$B/"
          {
            echo "hostapd $HOSTAP_VER for the OpenIPC T40 (mipsel, static)"
            echo "libnl:      $LIBNL_VER, static"
            echo "toolchain:  $(${CROSS}gcc --version | head -1)"
            echo "built:      $(date -u +%Y-%m-%dT%H:%M:%SZ) by run ${GITHUB_RUN_ID}"
            echo "binary:     $(file -b "$B/hostapd")"
            echo
            echo "Config: nl80211, WPA2-PSK, 802.11n, internal TLS."
            echo "hostapd_cli is deliberately NOT built: machino drives the"
            echo "            ctrl socket itself, so it would be dead weight."
            echo "NOT built in: WPS, EAP, RADIUS, accounting, VLAN, and SAE/WPA3"
            echo "            -- SAE needs EC support that internal TLS does not have."
            echo
            echo "NOT VERIFIED HERE: that it starts on the camera or that the"
            echo "AIC8800 driver accepts AP mode. Both need the hardware."
          } > "$B/BUILDINFO"
          (cd "$B" && sha256sum hostapd BUILDINFO > SHA256SUMS)
          cat "$B/BUILDINFO"

      - uses: actions/upload-artifact@v4
        with:
          name: hostapd-t40
          path: bundle/hostapd-t40
          if-no-files-found: error
