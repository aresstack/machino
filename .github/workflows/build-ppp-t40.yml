# pppd und chat fuer die T40, gegen dieselbe musl-Toolchain wie machino.
#
# WARUM DAS HIER GEBAUT WIRD
#
# Der PPP-Pfad aus AP-M7 ist die Ausweichmoeglichkeit fuer Modems und Netze, in
# denen ECM nicht geht. Ob ein OpenIPC-Image ein pppd mitbringt, ist von Image
# zu Image verschieden -- und eine Auswahl in der Oberflaeche, die auf der
# einen Kamera funktioniert und auf der naechsten stumm nichts tut, ist keine
# Auswahl. Also wird es mitgeliefert.
#
# KEIN OpenIPC-Patch. ppp ist ein eigenstaendiges Projekt; hier wird es
# uebersetzt und in die Machino-Nutzlast gelegt, mehr nicht.
#
# WAS BEWUSST NICHT MITKOMMT
#
#   pppd-Plugins   rp-pppoe, radius, winbind: nichts davon waehlt ein Modem an
#   pppstats       ein Diagnosewerkzeug, das niemand aufruft
#   pppdump        dito
#
# Auf einem 8,7-MB-Overlay ist jedes Kilobyte fuer ein Werkzeug, das nie
# gestartet wird, eine schlechte Entscheidung. `chat` kommt mit, weil pppd
# ohne die Wahl-Unterhaltung nie bis zum CONNECT kaeme.
#
# WAS DIESER BUILD NICHT BEWEIST: dass pppd auf der Kamera laeuft, dass das
# EC200A den Anruf annimmt oder dass eine Aushandlung durchgeht. Das braucht
# Hardware und steht als PENDING_PHYSICAL in machino/docs/pending-physical.md.
name: build-ppp-t40

on:
  workflow_dispatch:
    inputs:
      ppp_version:
        description: "ppp release tag to build"
        required: false
        default: "ppp-2.4.9"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-ppp-t40.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOC: T40
      PPP_VERSION: ${{ github.event.inputs.ppp_version || 'ppp-2.4.9' }}
    steps:
      - uses: actions/checkout@v4

      - name: "Fetch the same musl toolchain machino is built with"
        run: |
          set -eux
          ./build.sh deps "$SOC" --libc-musl
          TC=$(ls -d toolchain/xburst2-musl/*/bin | head -1)
          test -n "$TC" || { echo "::error::no toolchain"; exit 1; }
          echo "TC=$PWD/$TC" >> "$GITHUB_ENV"
          "$PWD/$TC/mipsel-linux-gcc" --version | head -1

      - name: "Fetch ppp"
        run: |
          set -eux
          curl -fsSL "https://github.com/ppp-project/ppp/archive/refs/tags/${PPP_VERSION}.tar.gz" -o ppp.tar.gz
          mkdir -p ppp && tar xzf ppp.tar.gz -C ppp --strip-components=1
          ( cd ppp && git init -q 2>/dev/null || true )

      - name: "Configure and build pppd + chat"
        run: |
          set -eux
          cd ppp
          export PATH="$TC:$PATH"
          export CC=mipsel-linux-gcc
          export AR=mipsel-linux-ar
          export RANLIB=mipsel-linux-ranlib
          export STRIP=mipsel-linux-strip
          # ppp 2.4.9 hat KEIN autoconf. Sein configure ist ein Shell-Skript,
          # das unbekannte Optionen stillschweigend schluckt -- ein
          # `--without-libpcap` sieht deshalb aus, als haette es gewirkt, und
          # der Build scheitert erst Minuten spaeter an einem fehlenden
          # pcap.h. Genau so ist dieser Workflow beim ersten Lauf rot geworden.
          #
          # Die Schalter liegen in pppd/Makefile, und dort werden sie gesetzt.
          ./configure --prefix=/usr --sysconfdir=/etc \
                      || { echo "::error::configure failed"; exit 1; }

          # ALLES abschalten, was eine fremde Bibliothek braucht -- in einem
          # Zug und nicht nacheinander.
          #
          # ppp 2.4.9 hat mehrere Zusatzfunktionen per Vorgabe AN, und jede
          # bringt eine eigene Abhaengigkeit mit, die diese Kamera nicht hat:
          #
          #   FILTER      libpcap, fuer Demand-Dialling-Filter
          #   USE_EAPTLS  OpenSSL
          #   USE_PAM     libpam
          #   USE_SRP     libsrp
          #
          # Keine davon wird hier gebraucht: machino entscheidet selbst, wann
          # gewaehlt wird, und das Netz authentifiziert sich nicht bei uns
          # (`noauth`). Eine Bibliothek, die auf der Kamera nicht liegt, macht
          # ausserdem aus einem ungenutzten Feature einen pppd, der gar nicht
          # erst startet.
          #
          # Einzeln abzuschalten hiesse eine CI-Runde je Abhaengigkeit, und
          # zwei davon haben wir schon verbraucht.
          sed -i 's/^\(FILTER\|USE_EAPTLS\|USE_PAM\|USE_SRP\|USE_SYSTEMD\|USE_LIBUTIL\)=y/#&/' \
              pppd/Makefile
          grep -E '^#?(FILTER|USE_EAPTLS|USE_PAM|USE_SRP)' pppd/Makefile || true

          # CC MUSS auf der Kommandozeile stehen, nicht in der Umgebung.
          #
          # ppps Makefiles setzen `CC = gcc` fest. Eine Zuweisung im Makefile
          # schlaegt die Umgebung, aber nicht die Kommandozeile -- mit
          # `export CC=...` baut make also munter mit dem Host-gcc weiter. Der
          # Build lief dann sauber durch und lieferte x86-Binaries; aufgefallen
          # ist es erst, weil mipsel-linux-strip sie nicht lesen konnte. Ein
          # Zufall, auf den sich niemand verlassen sollte -- deshalb steht
          # unten zusaetzlich eine Architekturpruefung.
          #
          # Nur pppd und chat. pppstats und pppdump sind Diagnosewerkzeuge, die
          # niemand aufruft, und jedes Kilobyte auf dem Overlay ist gezaehlt.
          # -std=gnu17, weil ppp 2.4.9 aelter ist als C23.
          #
          # pppd.h macht `typedef unsigned char bool;`. In C23 ist `bool` ein
          # Schluesselwort, und die Toolchain hier ist gcc 15, das per Vorgabe
          # gnu23 spricht -- jede Uebersetzungseinheit bricht an derselben
          # Zeile ab. Das ist keine Warnung, die man wegdrueckt: die Sprache
          # hat sich unter dem Quelltext geaendert.
          #
          # Die Alternative waere ppp 2.5.x, das den Typedef los ist. Es bringt
          # aber ein anderes Buildsystem und eine andere Plugin-ABI mit, und
          # beides fuer eine Zeile einzutauschen ist die groessere Aenderung.
          #
          # COPTS steht ausgeschrieben auf jeder make-Zeile und nicht in einer
          # Variablen: ein unquotiertes "$MK" wuerde "COPTS=-O2 -std=gnu17" in
          # zwei Woerter zerlegen, und -std=gnu17 landete als make-Argument
          # statt im Compiler-Aufruf. Das saehe wieder nach einem erfolgreichen
          # Build aus.
          make -C pppd -j"$(nproc)" \
               CC=mipsel-linux-gcc AR=mipsel-linux-ar RANLIB=mipsel-linux-ranlib \
               COPTS="-O2 -std=gnu17" \
               FILTER= USE_EAPTLS= USE_PAM= USE_SRP= USE_SYSTEMD= USE_LIBUTIL= \
               || { echo "::error::pppd build failed"; exit 1; }
          make -C chat -j"$(nproc)" \
               CC=mipsel-linux-gcc AR=mipsel-linux-ar RANLIB=mipsel-linux-ranlib \
               COPTS="-O2 -std=gnu17" \
               || { echo "::error::chat build failed"; exit 1; }

      - name: "Collect, strip and report"
        run: |
          set -eux
          export PATH="$TC:$PATH"
          mkdir -p out
          PPPD=$(find ppp -name pppd -type f -perm -u+x | head -1)
          CHAT=$(find ppp -name chat -type f -perm -u+x | head -1)
          test -n "$PPPD" || { echo "::error::no pppd binary was produced"; exit 1; }
          test -n "$CHAT" || { echo "::error::no chat binary was produced"; exit 1; }
          cp "$PPPD" out/pppd
          cp "$CHAT" out/chat

          # Ist das ueberhaupt MIPS? Ein Build, der still mit dem Host-gcc
          # durchlief, liefert lauffaehige x86-Binaries und faellt sonst
          # nirgends auf -- bis jemand sie auf die Kamera legt und "cannot
          # execute binary file" liest. Genau so ist dieser Workflow beim
          # zweiten Lauf rot geworden, und zwar nur, weil strip stolperte.
          for b in out/pppd out/chat; do
            arch=$(file -b "$b")
            case "$arch" in
              *MIPS*) ;;
              *) echo "::error::$b is not a MIPS binary: $arch"; exit 1 ;;
            esac
          done

          mipsel-linux-strip out/pppd out/chat

          # Dynamisch gelinkt gegen etwas, das die Kamera nicht hat, waere ein
          # Binary, das nur im Log auffaellt. Also wird nachgesehen, WAS es
          # braucht -- musl libc ist da, alles andere ist ein Fund.
          for b in out/pppd out/chat; do
            echo "== $b"
            mipsel-linux-readelf -d "$b" | grep NEEDED || echo "(statisch)"
            file "$b" || true
          done

          {
            echo "## ppp payload"
            echo
            echo "| | |"
            echo "|--|--|"
            echo "| Version | ${PPP_VERSION} |"
            echo "| pppd | $(stat -c %s out/pppd) bytes |"
            echo "| chat | $(stat -c %s out/chat) bytes |"
            echo
            echo "Gebaut, nicht erprobt. Dass pppd auf der Kamera startet und"
            echo "das EC200A den Anruf annimmt, braucht Hardware und steht als"
            echo "PENDING_PHYSICAL in machino/docs/pending-physical.md."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Upload"
        uses: actions/upload-artifact@v4
        with:
          name: ppp-t40
          path: out/
