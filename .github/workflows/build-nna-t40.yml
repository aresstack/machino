# machino-nna: der Venus/NNA-Inferenzhelfer fuer den T40 (nna1) + das Modell.
#
# Ein EIGENER Workflow, best effort wie die Modem-Module: der Haupt-Build
# (build-machino-t40) darf nie rot werden, weil eine Toolchain-Quelle oder
# das magik-toolkit gerade klemmt. Der Helfer ist eine OPTIONALE Payload.
#
# Zwei Artefakte:
#   machino-nna-t40      das statische uClibc-Binary (Ingenic-Toolchain)
#   machino-nna-model    yolov5s als T40-Magik-Modell (TransformKit, x86-Tool)
#   machino-nna-model-demo  yolov5n als T40-Magik-Modell: 2 MB statt 7,6, fuer
#                        ein volles Overlay (Job model-demo, unten)
#
# Warum Ingenics gcc720-Toolchain und nicht die musl von machinod: die
# libvenus.a ist uClibc/gcc7-C++, und die Grenze dazwischen ist die ganze
# Architekturentscheidung (machino/docs/architecture/nna.md).
name: build-nna-t40

on:
  push:
    paths:
      - 'machino/tools/nna/**'
      - '.github/workflows/build-nna-t40.yml'
  workflow_dispatch:

# GEPINNT: ein --depth-1-HEAD-Clone war nicht reproduzierbar (AP4). Derselbe
# Pin gilt fuer Runtime UND Modellkonvertierung -- Modell und libvenus muessen
# aus demselben Toolkit-Stand kommen (Versions-Gate der Runtime).
#
# Geholt wird das Repo IMMER per --filter=blob:none und dann nur die Pfade,
# die der Job braucht: ein voller Clone zieht die 100-MB-Checkpoints der
# Trainingspfade mit und brach am 2026-09-30 nach zehn Minuten mit "RPC
# failed ... early EOF" ab (roter Lauf 36780277987, Job model).
env:
  TOOLKIT_REPO: "https://github.com/wispytrace/magik-toolkit"
  TOOLKIT_REF: "e511d370dd7ff84664c9140e0590c354947c7eac"

jobs:
  helper:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: "Fetch Ingenic toolchain (mips-gcc720-glibc229, multilib incl. -muclibc)"
        run: |
          set -e
          curl -fsSL -o /tmp/tc.tar.gz \
            https://github.com/ballaswag/k1-discovery/releases/download/1.0.0/mips-gcc720-glibc229.tar.gz
          mkdir -p /opt/ingenic
          tar xzf /tmp/tc.tar.gz -C /opt/ingenic
          ls /opt/ingenic
          # Tiefe 3: /opt/ingenic/mips-gcc720-glibc229/bin/mips-linux-gnu-g++ --
          # maxdepth 2 hat genau eine Ebene zu frueh aufgehoert (roter Lauf 1).
          TC=$(find /opt/ingenic -maxdepth 3 -name 'mips-linux-gnu-g++' -path '*/bin/*' | head -1)
          [ -n "$TC" ] || { echo 'toolchain layout unexpected'; find /opt/ingenic -maxdepth 3 | head -20; exit 1; }
          echo "TCBIN=$(dirname "$TC")" >> "$GITHUB_ENV"

      - name: "Fetch magik-toolkit (InferenceKit nna1 = T40: venus.h + static libvenus)"
        run: |
          set -e
          git clone -q --filter=blob:none --no-checkout "$TOOLKIT_REPO" /tmp/magik-toolkit
          git -C /tmp/magik-toolkit checkout -q "$TOOLKIT_REF" -- InferenceKit/nna1
          ls /tmp/magik-toolkit/InferenceKit/nna1

      - name: "Build machino-nna (static uClibc, libvenus.a)"
        run: |
          set -e
          make -C machino/tools/nna \
            CROSS_COMPILE="$TCBIN/mips-linux-gnu-" \
            INFERENCEKIT=/tmp/magik-toolkit/InferenceKit/nna1/mips720-glibc229 \
            2>&1 | tee /tmp/nna-build.log
          test "${PIPESTATUS[0]}" = 0
          file machino/tools/nna/machino-nna | tee /tmp/filecheck
          grep -q 'MIPS' /tmp/filecheck
          grep -q 'statically linked' /tmp/filecheck || { echo 'NICHT statisch - liefe auf dem musl-Rootfs nie'; exit 1; }
          ls -la machino/tools/nna/machino-nna

      - uses: actions/upload-artifact@v4
        with:
          name: machino-nna-t40
          path: machino/tools/nna/machino-nna

      # Der Build-Log als Artefakt, GERADE im Fehlerfall: die Job-Logs sind
      # ohne Token nicht lesbar, Artefakte ueber nightly.link schon -- ohne
      # das hier ist ein roter Lauf ein Ratespiel.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: machino-nna-build-log
          path: /tmp/nna-build.log

  model:
    runs-on: ubuntu-22.04
    steps:
      - name: "Fetch magik-toolkit (TransformKit x86 + yolov5s.onnx + T40-Config + Quant-Datensatz)"
        run: |
          set -e
          git clone -q --filter=blob:none --no-checkout "$TOOLKIT_REPO" /tmp/magik-toolkit
          git -C /tmp/magik-toolkit checkout -q "$TOOLKIT_REF" -- TransformKit/magik-transform-tools Models/post/yolov5s
          ls -l /tmp/magik-toolkit/Models/post/yolov5s/yolov5s.onnx

      - name: "Convert yolov5s.onnx -> T40 Magik model (quantized)"
        run: |
          set -e
          cd /tmp/magik-toolkit/Models/post/yolov5s
          chmod +x ../../../TransformKit/magik-transform-tools
          # Erst sagen, was dem x86-Tool fehlt (ThirdParty/readme nennt eine
          # OpenCV-Abhaengigkeit hinter einem Baidu-Link) -- ein stummer
          # Exit-Code war roter Lauf 1.
          ldd ../../../TransformKit/magik-transform-tools || true
          ../../../TransformKit/magik-transform-tools \
            --inputpath  yolov5s.onnx \
            --outputpath ./yolov5s_t40_magik.mk.h \
            --config cfg/magik_t40.cfg \
            --save_quantize_model true 2>&1 | tail -40
          ls -la yolov5s_t40_magik* venus_sample_yolov5s/yolov5s_t40_magik* 2>/dev/null || true
          BIN=$(find . -name 'yolov5s_t40_magik.bin' | head -1)
          [ -n "$BIN" ] || { echo 'kein .bin erzeugt - Ausgabeform ansehen'; find . -name 'yolov5s_t40*' | head; exit 1; }
          mkdir -p /tmp/model
          cp "$BIN" /tmp/model/yolov5s_t40_magik.bin

      - name: "Manifest + Provenienz (AP4: kein Modell ohne SHA und Herkunft)"
        run: |
          set -e
          cd /tmp/magik-toolkit/Models/post/yolov5s
          TK=$TOOLKIT_REF
          SRC_SHA=$(sha256sum yolov5s.onnx | cut -d' ' -f1)
          CFG_SHA=$(sha256sum cfg/magik_t40.cfg | cut -d' ' -f1)
          TOOL_SHA=$(sha256sum ../../../TransformKit/magik-transform-tools | cut -d' ' -f1)
          OUT_SHA=$(sha256sum /tmp/model/yolov5s_t40_magik.bin | cut -d' ' -f1)
          # Input-Vertrag aus der TATSAECHLICHEN Konvertierungs-Config, nicht
          # erfunden: SOC=T40, INPUT_SHAPE 1x3x640x640, COLOR RGB, NORMAL 255.
          cat > /tmp/model/manifest.json <<EOF
          {
            "schemaVersion": 1,
            "id": "yolov5s-t40nn-dev",
            "task": "object-detection",
            "backend": "venus-nna",
            "nnaGeneration": "nna1",
            "soc": "t40nn",
            "modelFile": "yolov5s_t40_magik.bin",
            "modelSha256": "$OUT_SHA",
            "input": { "width": 640, "height": 640, "format": "RGB", "layout": "NCHW", "range": "0..1 (NORMAL 255)" },
            "outputs": "3 YOLOv5-Koepfe (Strides 8/16/32); Decode+NMS im Helfer via venus generate_box",
            "classes": [ { "id": 0, "label": "person" } ],
            "confidenceThreshold": 0.30,
            "nmsThreshold": 0.60,
            "license": "DEVELOPMENT_ONLY: yolov5s-Gewichte stammen via magik-toolkit von Ultralytics YOLOv5 (AGPL-3.0); fuer ein auslieferbares Modell den persondet-Trainingspfad des Toolkits nutzen (eigene Gewichte)",
            "source": "https://github.com/wispytrace/magik-toolkit Models/post/yolov5s/yolov5s.onnx",
            "sourceRevision": "$TK"
          }
          EOF
          cat > /tmp/model/provenance.txt <<EOF
          source onnx sha256:        $SRC_SHA
          toolkit revision:          $TK
          transform tool sha256:     $TOOL_SHA
          transform config sha256:   $CFG_SHA (cfg/magik_t40.cfg)
          command:                   magik-transform-tools --inputpath yolov5s.onnx --outputpath ./yolov5s_t40_magik.mk.h --config cfg/magik_t40.cfg --save_quantize_model true
          calibration set:           Models/post/yolov5s/yolov5-20 (im Toolkit gepinnt)
          output model sha256:       $OUT_SHA
          built:                     $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${GITHUB_RUN_ID}
          EOF
          cat /tmp/model/provenance.txt

      - uses: actions/upload-artifact@v4
        with:
          name: machino-nna-model
          path: /tmp/model/

      # Das UPLOAD-FERTIGE Buendel: die KI-Seite der Kamera nimmt genau EIN
      # .tgz mit Modell-.bin + manifest.json (+ provenance.txt) entgegen
      # (machino-ai-upload.cgi). Das Verzeichnis-Artefakt oben kommt von
      # GitHub als .zip -- das musste bisher jeder von Hand umpacken.
      - name: "Bundle for the AI page upload (.tgz)"
        run: |
          set -e
          ID=$(sed -n 's/.*"id": *"\([^"]*\)".*/\1/p' /tmp/model/manifest.json | head -1)
          mkdir -p /tmp/bundle
          tar -C /tmp/model -czf "/tmp/bundle/${ID:-model}-t40.tgz" .
          ls -la /tmp/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: machino-nna-model-bundle
          path: /tmp/bundle/

  # Das DEMO-Modell: yolov5n (Ultralytics, COCO-80) statt yolov5s -- ein
  # Viertel der Gewichte, als 8-bit-Magik 2,0 MB. Befund 2026-09-30: die
  # Kamera hat 4,1 MB Overlay frei, der 7,6-MB-yolov5s passt dort nie ohne
  # Karte. Derselbe Helfer (drei YOLOv5-Koepfe, Strides 8/16/32, 80 Klassen,
  # dieselben Anker), derselbe TransformKit, dieselbe Kalibrierung. Das
  # grosse Modell bleibt, das hier kommt als zweites Asset dazu.
  #
  # Der Weg, lokal am 2026-09-30 nachvollzogen: yolov5n.pt (Release v7.0,
  # SHA gepinnt) -> export.py (Repo v7.0, Legacy-Exporter, opset 12) -> ONNX
  # mit Sigmoid*Mul (SiLU) -> TransformKit schneidet an den drei Kopf-Convs
  # (OUTPUT im cfg, das Detect-Decode dahinter faellt weg) und quantisiert
  # 8 bit (mehr geht per PTQ nicht: QUANT_WEIGHT_BIT max 8) -> 2 006 990 B.
  # NICHT bewiesen: dass Venus die SiLU-Knoten auf der NNA korrekt rechnet
  # (das yolov5s des Toolkits ist LeakyReLU). docs/pending-physical.md B11.
  model-demo:
    runs-on: ubuntu-22.04
    env:
      YOLOV5_REPO: "https://github.com/ultralytics/yolov5"
      YOLOV5_REF: "915bbf294bb74c859f0b41f1c23bc395014ea679"     # tag v7.0 (2022-11-22)
      YOLOV5N_URL: "https://github.com/ultralytics/yolov5/releases/download/v7.0/yolov5n.pt"
      YOLOV5N_SHA256: "4f180cf23ba0717ada0badd6c685026d73d48f184d00fc159c2641284b2ac0a3"
    steps:
      - name: "Fetch magik-toolkit: nur TransformKit + Kalibrierbilder (kein 30-MB-ONNX, keine .pt)"
        run: |
          set -e
          git clone -q --filter=blob:none --no-checkout "$TOOLKIT_REPO" /tmp/magik-toolkit
          git -C /tmp/magik-toolkit checkout -q "$TOOLKIT_REF" -- TransformKit/magik-transform-tools Models/post/yolov5s/yolov5-20 Models/post/yolov5s/cfg
          chmod +x /tmp/magik-toolkit/TransformKit/magik-transform-tools
          ls /tmp/magik-toolkit/Models/post/yolov5s/yolov5-20 | wc -l

      - name: "Python: torch (CPU) und die Export-Abhaengigkeiten von yolov5 v7.0"
        run: |
          set -e
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python3 -m pip install -q onnx pandas pyyaml tqdm matplotlib seaborn requests psutil opencv-python-headless ipython gitpython pillow scipy "setuptools<81"
          python3 -c "import torch, onnx; print('torch', torch.__version__, 'onnx', onnx.__version__)"

      - name: "yolov5n.pt (Ultralytics v7.0, SHA gepinnt) -> ONNX (opset 12, Legacy-Exporter)"
        run: |
          set -e
          git clone -q "$YOLOV5_REPO" /tmp/yolov5
          git -C /tmp/yolov5 checkout -q "$YOLOV5_REF"
          curl -sSL -o /tmp/yolov5n.pt "$YOLOV5N_URL"
          echo "$YOLOV5N_SHA256  /tmp/yolov5n.pt" | sha256sum -c -
          cd /tmp/yolov5
          # Neuere torch-Versionen exportieren per dynamo (braucht onnxscript,
          # anderer Graph) und laden Checkpoints weights_only (das v7.0-.pt
          # pickelt models.yolo.Model). Beides auf 2022 zurueckgestellt --
          # derselbe Graph wie beim Toolkit-ONNX, nur mit SiLU statt LeakyReLU.
          if python3 -c "import inspect, torch; import sys; sys.exit(0 if 'dynamo' in inspect.signature(torch.onnx.export).parameters else 1)"; then
            sed -i 's/opset_version=opset,/opset_version=opset, dynamo=False,/' export.py
          fi
          TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1 python3 export.py --weights /tmp/yolov5n.pt --include onnx --opset 12 --imgsz 640 640
          ls -l /tmp/yolov5n.onnx
          python3 - <<'PY'
          import onnx
          m = onnx.load('/tmp/yolov5n.onnx')
          heads = [o for n in m.graph.node if n.op_type == 'Conv' and any('model.24.m' in i for i in n.input) for o in n.output]
          want = ['/model.24/m.0/Conv_output_0', '/model.24/m.1/Conv_output_0', '/model.24/m.2/Conv_output_0']
          assert heads == want, heads
          ins = [i.name for i in m.graph.input if not i.name.startswith('model.')]
          assert ins == ['images'], ins
          print('head convs:', heads)
          PY

      - name: "ONNX -> T40 Magik (8 bit; Schnitt an den drei Kopf-Convs; Kalibrierung: die 19 Toolkit-Bilder)"
        run: |
          set -e
          mkdir -p /tmp/demo && cd /tmp/demo
          cp /tmp/yolov5n.onnx .
          cat > magik_t40_yolov5n.cfg <<EOF
          {
            "SOC":"T40",
            "INPUT":["images"],
            "INPUT_SHAPE":[1,3,640,640],
            "MEAN":[0,0,0],
            "NORMAL":[255.0,255.0,255.0],
            "COLOR":["RGB"],
            "OUTPUT":["/model.24/m.0/Conv_output_0","/model.24/m.1/Conv_output_0","/model.24/m.2/Conv_output_0"],
            "QUANT_DATASET_PATH":"/tmp/magik-toolkit/Models/post/yolov5s/yolov5-20/"
          }
          EOF
          # Das Tool meldet den Erfolg im Text und beendet sich trotzdem mit
          # Exit 1 (gemessen 2026-09-30); Text und .bin entscheiden.
          /tmp/magik-toolkit/TransformKit/magik-transform-tools \
            --inputpath yolov5n.onnx --outputpath ./yolov5n_t40_magik.mk.h \
            --config magik_t40_yolov5n.cfg --save_quantize_model true > transform.log 2>&1 || true
          tail -5 transform.log
          grep -q "Convert successfully" transform.log || { tail -40 transform.log; echo "::error::TransformKit did not report success"; exit 1; }
          BIN=$(find . -name 'yolov5n_t40_magik.bin' | head -1)
          [ -s "$BIN" ] || { echo "::error::no yolov5n_t40_magik.bin produced"; find . -name 'yolov5n*' | head; exit 1; }
          sz=$(stat -c %s "$BIN"); echo "demo model: $sz bytes"
          [ "$sz" -lt 3000000 ] || { echo "::error::demo model is $sz bytes -- that no longer fits a 4 MB overlay"; exit 1; }
          mkdir -p /tmp/demo-model
          cp "$BIN" /tmp/demo-model/yolov5n_t40_magik.bin

      - name: "Manifest + Provenienz (AP4: kein Modell ohne SHA und Herkunft)"
        run: |
          set -e
          TK=$TOOLKIT_REF
          SRC_SHA=$(sha256sum /tmp/yolov5n.onnx | cut -d' ' -f1)
          TOOL_SHA=$(sha256sum /tmp/magik-toolkit/TransformKit/magik-transform-tools | cut -d' ' -f1)
          CFG_SHA=$(sha256sum /tmp/demo/magik_t40_yolov5n.cfg | cut -d' ' -f1)
          OUT_SHA=$(sha256sum /tmp/demo-model/yolov5n_t40_magik.bin | cut -d' ' -f1)
          cat > /tmp/demo-model/manifest.json <<EOF
          {
            "schemaVersion": 1,
            "id": "yolov5n-t40nn-demo",
            "task": "object-detection",
            "backend": "venus-nna",
            "nnaGeneration": "nna1",
            "soc": "t40nn",
            "modelFile": "yolov5n_t40_magik.bin",
            "modelSha256": "$OUT_SHA",
            "input": { "width": 640, "height": 640, "format": "RGB", "layout": "NCHW", "range": "0..1 (NORMAL 255)" },
            "outputs": "3 YOLOv5-Koepfe (Strides 8/16/32); Decode+NMS im Helfer via venus generate_box",
            "classes": [ { "id": 0, "label": "person" } ],
            "confidenceThreshold": 0.30,
            "nmsThreshold": 0.60,
            "license": "DEMO_ONLY: yolov5n-Gewichte von Ultralytics YOLOv5 v7.0 (AGPL-3.0), 8-bit post-training-quantisiert mit dem magik-toolkit; ein Viertel von yolov5s, fuer erste Gehversuche auf einem vollen Overlay. NICHT hardwareerprobt (SiLU auf der NNA). Fuer ein auslieferbares Modell eigene Gewichte (persondet-Trainingspfad des Toolkits)",
            "source": "$YOLOV5N_URL (sha256 $YOLOV5N_SHA256), exportiert mit $YOLOV5_REPO @ $YOLOV5_REF",
            "sourceRevision": "$TK"
          }
          EOF
          cat > /tmp/demo-model/provenance.txt <<EOF
          weights:                   $YOLOV5N_URL
          weights sha256:            $YOLOV5N_SHA256
          export:                    $YOLOV5_REPO @ $YOLOV5_REF, export.py --include onnx --opset 12 --imgsz 640 640 (legacy exporter, TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD=1)
          torch:                     $(python3 -c "import torch; print(torch.__version__)")
          onnx sha256:               $SRC_SHA
          toolkit revision:          $TK
          transform tool sha256:     $TOOL_SHA
          transform config sha256:   $CFG_SHA (magik_t40_yolov5n.cfg: OUTPUT = the three head convolutions)
          command:                   magik-transform-tools --inputpath yolov5n.onnx --outputpath ./yolov5n_t40_magik.mk.h --config magik_t40_yolov5n.cfg --save_quantize_model true
          calibration set:           Models/post/yolov5s/yolov5-20 (im Toolkit gepinnt)
          output model sha256:       $OUT_SHA
          built:                     $(date -u +%Y-%m-%dT%H:%M:%SZ) run ${GITHUB_RUN_ID}
          EOF
          cat /tmp/demo-model/provenance.txt

      - uses: actions/upload-artifact@v4
        with:
          name: machino-nna-model-demo
          path: /tmp/demo-model/

      - name: "Bundle for the AI page upload (.tgz)"
        run: |
          set -e
          mkdir -p /tmp/demo-bundle
          tar -C /tmp/demo-model -czf /tmp/demo-bundle/yolov5n-t40nn-demo-t40.tgz .
          ls -l /tmp/demo-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: machino-nna-model-demo-bundle
          path: /tmp/demo-bundle/
