name: buildroot-package
# Validates the Buildroot integration with Buildroot's OWN package linter
# (utils/check-package) - it catches .mk / Config.in / .hash mistakes,
# convention and dependency-declaration issues (it found the header bug).
#
# We deliberately do NOT build a Buildroot toolchain here: build-machino-t40
# already cross-compiles machino with the thingino toolchain via the exact same
# `make -C machino CROSS_COMPILE=... IMP_INC=... IMPLIBS=...` the package .mk
# uses, so the real compile + IMP linkage is covered there. Building a full
# Buildroot musl toolchain from scratch just to re-validate the package would
# cost ~30 min per push for no meaningful extra coverage.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/buildroot-package.yml'
      - 'machino/openipc/buildroot/**'
jobs:
  check-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BR_VERSION: "2024.02.9"
    steps:
      - uses: actions/checkout@v4
      - name: "Install flake8 (check-package imports it)"
        run: |
          sudo apt-get update && sudo apt-get install -y python3-pip wget
          pip3 install --quiet flake8
      - name: "Fetch Buildroot ${{ env.BR_VERSION }}"
        run: |
          wget -q "https://buildroot.org/downloads/buildroot-$BR_VERSION.tar.gz" -O "$RUNNER_TEMP/buildroot.tar.gz"
          tar -xzf "$RUNNER_TEMP/buildroot.tar.gz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/buildroot-$BR_VERSION" "$RUNNER_TEMP/buildroot"
      - name: "check-package (Buildroot's own package linter)"
        run: |
          cd "$RUNNER_TEMP/buildroot"
          ./utils/check-package -b "$GITHUB_WORKSPACE"/machino/openipc/buildroot/package/machino/*
