# Validate docs/wiki/ on pull requests and mirror it into the GitHub wiki from main.
#
# docs/wiki/ is the single source of truth. Documentation prose stays curated in
# Git; CI validates structure but never generates or rewrites content.
#
# AUTH: no PAT. The sync job uses the automatically provided GITHUB_TOKEN with
# job-scoped `contents: write`. Pull-request validation stays read-only.
name: Sync wiki

on:
  pull_request:
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
  # Allow an explicit resync after infrastructure or wiki changes.
  workflow_dispatch:

# Main pushes share one group so two wiki publications cannot race. PR refs use
# separate groups and therefore do not block unrelated reviews.
concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: false

# Default to the minimum permission. Only the publication job receives write.
permissions:
  contents: read

jobs:
  validate:
    name: Validate wiki structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep navigation semantic and human-curated, but make structural drift a
      # CI error. Every public Markdown page must be reachable from _Sidebar.md,
      # and every wiki link in the sidebar must resolve to a real page.
      - name: Validate wiki structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("docs/wiki")
          required = [root / "Home.md", root / "_Sidebar.md"]
          errors = []

          for path in required:
              if not path.is_file():
                  errors.append("Missing required wiki file: %s" % path)

          if errors:
              for error in errors:
                  print("ERROR: %s" % error)
              sys.exit(1)

          sidebar = (root / "_Sidebar.md").read_text(encoding="utf-8")
          wiki_link_pattern = re.compile(r"\[\[([^\]]+)\]\]")
          sidebar_targets = set()

          for match in wiki_link_pattern.finditer(sidebar):
              raw = match.group(1).strip()
              target = raw.split("|", 1)[-1].strip()
              target = target.split("#", 1)[0].strip()
              if not target:
                  errors.append("Empty wiki target in _Sidebar.md: [[%s]]" % raw)
                  continue

              target_path = root / (target + ".md")
              if not target_path.is_file():
                  errors.append(
                      "Broken _Sidebar.md target [[%s]] -> %s" % (raw, target_path)
                  )
                  continue

              sidebar_targets.add(target)

          public_pages = {
              path.stem
              for path in root.glob("*.md")
              if not path.name.startswith("_")
          }
          orphaned = sorted(public_pages - sidebar_targets)
          if orphaned:
              errors.append(
                  "Wiki pages missing from _Sidebar.md: %s" % ", ".join(orphaned)
              )

          if errors:
              for error in errors:
                  print("ERROR: %s" % error)
              sys.exit(1)

          print(
              "Wiki structure OK: %d public pages, all present in _Sidebar.md."
              % len(public_pages)
          )
          PY

  sync:
    name: Publish GitHub wiki
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: source

      # The wiki is a separate git repository (<repo>.wiki). checkout leaves it
      # in wiki/ with the GITHUB_TOKEN configured as its push credential.
      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      # --delete makes docs/wiki/ authoritative. Manual edits in the GitHub wiki
      # are overwritten on the next sync; edit docs/wiki/ through normal commits.
      - name: Copy docs/wiki into the wiki working tree
        run: rsync -a --delete --exclude '.git' source/docs/wiki/ wiki/

      - name: Commit and push if anything changed
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "Wiki already matches docs/wiki - nothing to do."
            exit 0
          fi

          git add -A
          git commit -m "Sync wiki from docs/wiki (${GITHUB_SHA::7})"
          git push
