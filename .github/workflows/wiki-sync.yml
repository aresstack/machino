# Mirror docs/wiki/ into the GitHub wiki.
#
# WHY THIS EXISTS: the wiki was populated once, by hand, in a single import
# commit - and then never again. It drifted silently: a page added to
# docs/wiki/ on main sat there for days while the wiki a visitor actually
# reads had no such page and an index that did not list it. Nothing warns you,
# because the wiki is a separate git repository that no normal push touches.
#
# docs/wiki/ is the single source of truth. This job makes the wiki a copy of
# it, including deletions - see the --delete note below.
#
# AUTH: no PAT. The wiki of THIS repository is reachable with the automatically
# provided GITHUB_TOKEN as long as the job is granted `contents: write`.
# actions/checkout wires that token into the checked-out wiki repo's origin, so
# the final `git push` uses it. (Confirmed working pattern, GitHub Community
# Discussion #56893.)
name: Sync wiki

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  # Manual run, for the first sync after a drift and for testing.
  workflow_dispatch:

# One sync at a time: two concurrent runs would race on the same wiki repo and
# the loser would fail its push. Queue instead of cancelling, so the last
# content state always wins rather than an arbitrary interrupted one.
concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: source

      # The wiki is a separate git repository (<repo>.wiki). checkout leaves it
      # in wiki/ with the GITHUB_TOKEN configured as its push credential, which
      # `contents: write` above authorises. Its default branch is master.
      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      # --delete makes docs/wiki/ authoritative: a page removed there is removed
      # in the wiki, and a page edited through the wiki web UI is overwritten on
      # the next sync. That is the intended contract - a mirror that only ever
      # added would drift back into the state this workflow exists to prevent -
      # but it does mean the web UI is read-only in practice. Edit docs/wiki/.
      - name: Copy docs/wiki into the wiki working tree
        run: rsync -a --delete --exclude '.git' source/docs/wiki/ wiki/

      - name: Commit and push if anything changed
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Wiki already matches docs/wiki - nothing to do."
            exit 0
          fi
          git add -A
          git commit -m "Sync wiki from docs/wiki (${GITHUB_SHA::7})"
          git push
